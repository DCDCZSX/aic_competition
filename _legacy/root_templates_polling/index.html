<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能MDT多学科会诊系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn.consulting {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }

        .discussion-area {
            grid-column: 1 / -1;
        }

        .messages-container {
            max-height: 500px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .message {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: bold;
            color: #667eea;
        }

        .timestamp {
            color: #666;
            font-size: 0.9em;
        }

        .message-content {
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
        }

        .conclusion {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .status-indicator {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            background: #cce5ff;
            color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 智能MDT多学科会诊系统</h1>
            <p>多智能体协作诊疗平台</p>
        </div>

        <div class="main-content">
            <!-- 患者信息录入 -->
            <div class="card">
                <h2>📋 患者信息录入</h2>
                <form id="patientForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">患者姓名 *</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="age">年龄 *</label>
                            <input type="number" id="age" name="age" min="0" max="150" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="gender">性别 *</label>
                            <select id="gender" name="gender" required>
                                <option value="">请选择</option>
                                <option value="男">男</option>
                                <option value="女">女</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="medical_history">病历信息 *</label>
                        <textarea id="medical_history" name="medical_history" 
                                placeholder="请输入患者的详细病历信息，包括主诉、现病史、既往史、体格检查、辅助检查结果等..." 
                                required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="main_issue">主要会诊问题 *</label>
                        <textarea id="main_issue" name="main_issue" 
                                placeholder="请输入本次MDT会诊需要重点讨论的核心问题..." 
                                required></textarea>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        🚀 启动MDT会诊
                    </button>
                </form>
            </div>

            <!-- 会诊状态 -->
            <div class="card">
                <h2>📊 会诊状态</h2>
                <div id="statusArea">
                    <div id="statusContent">
                        <p style="text-align: center; color: #666; padding: 40px;">
                            请填写患者信息并启动会诊
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 讨论结果 -->
        <div class="card discussion-area" id="discussionArea" style="display: none;">
            <h2>💬 MDT会诊过程</h2>
            <div class="messages-container" id="messagesContainer"></div>
        </div>
    </div>

    <script>
        let isConsulting = false;
        let currentDiscussionId = null;
        let statusCheckInterval = null;

        document.getElementById('patientForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (isConsulting) return;
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // 验证必填字段
            if (!data.name || !data.age || !data.gender || !data.medical_history || !data.main_issue) {
                alert('请填写所有必填字段！');
                return;
            }
            
            await startConsultation(data);
        });

        async function startConsultation(data) {
            isConsulting = true;
            updateSubmitButton();
            updateStatus('正在启动MDT会诊...', 'progress');
            
            try {
                const response = await fetch('/api/start_consultation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.status === 'started') {
                    currentDiscussionId = result.discussion_id;
                    updateStatus('会诊已启动，正在分析病历...', 'progress');
                    
                    // 显示讨论区域
                    document.getElementById('discussionArea').style.display = 'block';
                    
                    // 开始轮询状态
                    startStatusPolling();
                } else {
                    throw new Error(result.error || '启动失败');
                }
                
            } catch (error) {
                console.error('Error:', error);
                updateStatus(`启动失败: ${error.message}`, 'error');
                isConsulting = false;
                updateSubmitButton();
            }
        }

        function startStatusPolling() {
            statusCheckInterval = setInterval(async () => {
                if (!currentDiscussionId) return;
                
                try {
                    const response = await fetch(`/api/get_discussion_status/${currentDiscussionId}`);
                    const status = await response.json();
                    
                    if (status.status === 'not_found') {
                        clearInterval(statusCheckInterval);
                        return;
                    }
                    
                    // 更新消息显示
                    updateMessages(status.messages || []);
                    
                    // 更新状态
                    if (status.status === 'completed') {
                        updateStatus('MDT会诊完成', 'completed');
                        clearInterval(statusCheckInterval);
                        isConsulting = false;
                        updateSubmitButton();
                    } else if (status.status === 'error') {
                        updateStatus('会诊过程中出现错误', 'error');
                        clearInterval(statusCheckInterval);
                        isConsulting = false;
                        updateSubmitButton();
                    } else {
                        updateStatus('会诊进行中...', 'progress');
                    }
                    
                } catch (error) {
                    console.error('Status check error:', error);
                }
            }, 2000); // 每2秒检查一次
        }

        function updateMessages(messages) {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';
            
            messages.forEach(message => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message';
                messageDiv.innerHTML = `
                    <div class="message-header">
                        <span class="agent-name">${message.agent}</span>
                        <span class="timestamp">${message.timestamp}</span>
                    </div>
                    <div class="message-content">${message.content}</div>
                `;
                container.appendChild(messageDiv);
            });
            
            // 滚动到底部
            container.scrollTop = container.scrollHeight;
        }

        function updateSubmitButton() {
            const btn = document.getElementById('submitBtn');
            if (isConsulting) {
                btn.textContent = '🔄 会诊进行中...';
                btn.disabled = true;
            } else {
                btn.textContent = '🚀 启动MDT会诊';
                btn.disabled = false;
            }
        }

        function updateStatus(message, type) {
            const statusContent = document.getElementById('statusContent');
            
            const statusClass = type === 'progress' ? 'status-progress' : 
                              type === 'completed' ? 'status-completed' : 
                              'status-pending';
            
            statusContent.innerHTML = `
                <div style="text-align: center; padding: 20px;">
                    <span class="status-indicator ${statusClass}">${message}</span>
                </div>
            `;
        }
    </script>
</body>
</html>
