/* ===================== 屏 F：逐条审核 ===================== */
function reviewScrollHost(){
  return document.querySelector('.doctor-case-main') || document.scrollingElement;
}
function captureReviewScroll(){
  const host = reviewScrollHost();
  return host ? {host, top:host.scrollTop} : null;
}
function restoreReviewScroll(snapshot){
  if(!snapshot || !snapshot.host) return;
  requestAnimationFrame(()=>{ snapshot.host.scrollTop = snapshot.top; });
}
function renderReview(){
  $('review-heading').classList.remove('hide');
  $('rev-publish-inline').classList.remove('hide');
  $('rev-detail').classList.add('hide');
  $('rev-category').classList.add('hide');
  $('rev-body').classList.remove('hide');
  const r = S.review||{};
  const items = r.items||[];
  S.reviewActiveItemIds = Array.isArray(S.reviewActiveItemIds) ? S.reviewActiveItemIds : [];
  const sum = r.summary||{};
  const stale_decisions = r.stale_decisions||[];
  const review_item_changes = r.review_item_changes||{};
  const reopened_item_ids = review_item_changes.reopened_item_ids||[];
  const reopened_item_labels = review_item_changes.reopened_item_labels||[];
  const screening = r.mdt_screening||{};
  const triageConfirmation = r.triage_doctor_confirmation||{};
  const formalRecord = r.mdt_formal_record||{};
  const stateCls = {'awaiting':'st-awaiting','confirmed':'st-confirmed','modified':'st-modified','rejected':'st-rejected','uncertain':'st-uncertain','auto_processed':'st-auto'};
  if(!items.length){
    $('rev-body').innerHTML = '<div class="banner warn">该病例暂无决策条目（需先完成分诊与路径生成）。</div>';
    const emptyInline = $('rev-publish-inline'); if(emptyInline) emptyInline.innerHTML = '';
    return;
  }
  const typeLabel = {'path_step':'医疗安排','consensus_item':'共识与分歧'};
  // API 分级值固定为 review_tier==='required'、review_tier==='sample'、review_tier==='automatic'。
  const tierOf = it=>it.review_tier || (it.needs_doctor_review===false?'automatic':'required');
  const tierLabel = {required:'必审', sample:'建议抽查', automatic:'自动处理'};
  function doctorFacingContent(value){
    return String(value||'').replace(/^\s*(?:建议\s*)?(?:向医生确认|请医生确认)\s*[:：]?\s*/,'待医生判断：').trim();
  }
  function reviewActions(it, compact){
    if(['confirmed','modified','rejected','uncertain'].includes(String(it.state||''))) return '<span class="review-complete-label">已审核</span>';
    const tier = tierOf(it);
    const actions = compact
      ? `<button class="primary mini" onclick="decide('${esc(it.item_id)}','accept')">接管并确认</button>
         <button class="mini" onclick="openModal('modify','${esc(it.item_id)}')">修改</button>
         <button class="mini" onclick="openModal('reject','${esc(it.item_id)}')">驳回</button>`
      : `<button class="primary mini" onclick="decide('${esc(it.item_id)}','accept')">接受</button>
         <button class="mini" onclick="openModal('modify','${esc(it.item_id)}')">修改</button>
         <button class="mini" onclick="openModal('reject','${esc(it.item_id)}')">驳回</button>
          <button class="mini" onclick="openModal('uncertain','${esc(it.item_id)}')">暂不确定</button>
          <button class="mini" onclick="openModal('request_more_info','${esc(it.item_id)}')">请求补资料</button>`;
    return actions;
  }
  function itemMarkup(it, index, compact){
    const tier = tierOf(it);
    const tone=it.state==='confirmed'||it.state==='modified'?'ok':(it.state==='rejected'?'danger':(it.state==='uncertain'?'warn':(it.state==='auto_processed'?'info':'gray')));
    const actions = reviewActions(it, compact);
    return `<div class="item ${stateCls[it.state]||''} review-decision-card" data-state="${esc(it.state)}">
      <div class="head review-card-head"><div class="review-card-title"><strong>${index}. ${esc(it.title)}</strong>
        <div class="review-card-tags"><span class="pill gray">${esc(typeLabel[it.target_type]||'审核内容')}</span>
        <span class="pill ${tier==='required'?'danger':(tier==='sample'?'warn':'info')}">${esc(it.review_tier_label||tierLabel[tier]||tier||'必审')}</span>
        <span class="pill ${tone}">${esc(it.state_label)}</span>
        ${it.changed_by_doctor?'<span class="pill ok">医生已改写</span>':''}</div>
      </div></div>
       <div class="review-card-summary"><span class="muted">${it.changed_by_doctor?'审核后表述':'AI 初稿'}</span><span class="${it.changed_by_doctor?'old':''}">${esc(doctorFacingContent(it.changed_by_doctor?it.reviewer_content:it.ai_content))}</span></div>
       <div class="body">
         ${(it.high_risk||it.conflict||it.analysis_failed)?`<div class="tiny" style="color:var(--danger);">${it.high_risk?'高风险　':''}${it.conflict?'存在冲突　':''}${it.analysis_failed?'分析失败':''}</div>`:''}
         ${it.batch_block_reason?`<div class="tiny" style="color:var(--warn);">处理要求：${esc(it.batch_block_reason)}</div>`:''}
       </div><div class="review-card-actions">${actions}</div>
       <div class="review-card-actions"><button class="ghost mini" aria-label="查看审核详情" onclick="openReviewDetail('${esc(it.item_id)}')">查看详情</button></div>
     </div>`;
  }
  function uniqueEvidenceRefs(it){
    const reason = String(it.reason_hint||'').replace(/\s+/g,'').trim();
    const normalize = value => String(value||'').replace(/^\s*(?:专科意见|来源|证据)\s*[:：]?\s*/,'').replace(/\s+/g,'').trim();
    const seen = new Set();
    return (it.evidence_refs||[]).map(ref=>String(ref||'').trim()).filter(ref=>{
      const key = normalize(ref);
      if(!key || seen.has(key)) return false;
      seen.add(key);
      return !reason || !(reason.includes(key) || key.includes(reason));
    });
  }
  function reviewDetailMarkup(it){
    const typeLabel = {'path_step':'医疗安排','consensus_item':'共识与分歧'};
    const tier = tierOf(it);
    const tone=it.state==='confirmed'||it.state==='modified'?'ok':(it.state==='rejected'?'danger':(it.state==='uncertain'?'warn':(it.state==='auto_processed'?'info':'gray')));
    const current = doctorFacingContent(it.changed_by_doctor?it.reviewer_content:it.ai_content);
    const evidenceRefs = uniqueEvidenceRefs(it);
    const hasEvidence = (it.evidence_refs||[]).length>0;
    return `<div class="card review-detail-content">
      <div class="review-detail-head">
        <div><button class="primary review-detail-back" onclick="closeReviewDetail()">← 返回审核列表</button>
          <h3 style="margin:0;">${esc(it.title||'待审核内容')}</h3>
          <div class="review-card-tags"><span class="pill gray">${esc(typeLabel[it.target_type]||'审核内容')}</span>
            <span class="pill ${tier==='required'?'danger':(tier==='sample'?'warn':'info')}">${esc(it.review_tier_label||'审核')}</span>
            <span class="pill ${tone}">${esc(it.state_label||'待审')}</span></div>
        </div>
      </div>
      <div class="review-detail-section"><h3>${it.changed_by_doctor?'审核后表述':'AI 初稿'}</h3><div class="review-copy">${esc(current)}</div></div>
      ${it.changed_by_doctor?`<div class="review-detail-section"><h3>修改说明</h3><div class="review-copy">${esc(it.decision_reason||'已由医生改写')}</div></div>`:''}
      ${it.reason_hint?`<div class="review-detail-section"><h3>判断依据</h3><div class="review-copy">${esc(it.reason_hint)}</div></div>`:''}
      ${(it.high_risk||it.conflict||it.analysis_failed||it.batch_block_reason)?`<div class="review-detail-section"><h3>处理提示</h3><div class="review-copy">${it.high_risk?'高风险。 ':''}${it.conflict?'存在意见冲突。 ':''}${it.analysis_failed?'分析未完成。 ':''}${it.batch_block_reason?'处理要求：'+esc(it.batch_block_reason):''}</div></div>`:''}
      ${(hasEvidence||it.reason_hint)?`<div class="review-detail-section"><h3>可核对证据</h3>${evidenceRefs.length?sourceRefHtml(evidenceRefs):'<div class="review-meta">暂无独立证据引用；相关内容已包含在判断依据中。</div>'}</div>`:''}
      <div class="review-detail-section"><h3>审核信息</h3><div class="review-meta">审核要求：${esc(it.tier_reason||'需要医生判断')}<br>内容版本：${esc(it.content_revision||1)}${it.auto_reason?`<br>自动处理说明：${esc(it.auto_reason)}`:''}${it.decision_reason&&!it.changed_by_doctor?`<br>审核记录：${esc(it.state_label||'')}｜${esc(it.decision_reason)}｜${esc(it.reviewer||'')} ${esc(it.decided_at||'')}`:''}</div></div>
      <div class="review-card-actions">${reviewActions(it, tier==='automatic')}</div>
    </div>`;
  }
  function openReviewDetail(itemId, returnContext, preserveScroll){
    const item = (S.review&&S.review.items||[]).find(it=>it.item_id===itemId);
    if(!item) return;
    S.reviewDetailItemId = itemId;
    S.reviewDetailReturn = returnContext || ($('rev-category') && !$('rev-category').classList.contains('hide') ? 'category' : 'list');
    $('rev-body').classList.add('hide');
    $('rev-category').classList.add('hide');
    $('review-heading').classList.add('hide');
    $('rev-publish-inline').classList.add('hide');
    $('rev-detail').classList.remove('hide');
    $('rev-detail').innerHTML = reviewDetailMarkup(item);
    if(!preserveScroll) $('rev-detail').scrollIntoView({behavior:'smooth', block:'start'});
  }
  function closeReviewDetail(){
    $('rev-detail').classList.add('hide');
    $('rev-detail').innerHTML = '';
    if(S.reviewDetailReturn==='category') $('rev-category').classList.remove('hide');
    else $('rev-body').classList.remove('hide');
    $('review-heading').classList.remove('hide');
    $('rev-publish-inline').classList.remove('hide');
  }
  // 内联按钮由浏览器事件属性调用，显式挂到全局避免局部作用域丢失。
  window.openReviewDetail = openReviewDetail;
  window.closeReviewDetail = closeReviewDetail;
  const categoryDefs = [
    {key:'required', title:'必须医生决定', list:items.filter(it=>tierOf(it)==='required' && (it.state==='awaiting' || S.reviewActiveItemIds.includes(it.item_id))), cls:'pending', meta:'需要医生逐条确认，处理后才可发布。'},
    {key:'sample', title:'建议抽查', list:items.filter(it=>tierOf(it)==='sample' && (it.state==='awaiting' || S.reviewActiveItemIds.includes(it.item_id))), cls:'sample', meta:'系统已完成初步处理，医生可抽查并接管。'},
    {key:'processed', title:'已完成审核', list:items.filter(it=>!['awaiting','auto_processed'].includes(it.state) && tierOf(it)!=='automatic'), cls:'processed', meta:'已处理条目，可进入查看审核记录。'},
    {key:'auto', title:'已自动处理', list:items.filter(it=>tierOf(it)==='automatic' && (it.state==='auto_processed' || !it.decision_id || S.reviewActiveItemIds.includes(it.item_id))), cls:'auto', meta:'系统自动处理，不阻塞发布，可随时接管。'}
  ];
  function renderReviewCategory(key, preserveScroll){
    const def = categoryDefs.find(entry=>entry.key===key);
    if(!def) return;
    S.reviewCategoryKey = key;
    S.reviewDetailReturn = 'category';
    $('rev-body').classList.add('hide');
    $('rev-detail').classList.add('hide');
    $('review-heading').classList.add('hide');
    $('rev-publish-inline').classList.add('hide');
    $('rev-category').classList.remove('hide');
    $('rev-category').innerHTML = `<div class="card review-detail-content">
      <div class="review-detail-head"><div><button class="primary review-detail-back" onclick="closeReviewCategory()">← 返回审核分类</button><h3 style="margin:0;">${def.title}</h3><div class="review-meta">${def.meta}</div></div><span class="pill gray">${def.list.length} 条</span></div>
      ${def.list.length ? def.list.map((it)=>itemMarkup(it, items.indexOf(it)+1, def.key==='auto')).join('') : '<div class="banner gray">此分类暂无条目。</div>'}
    </div>`;
    if(!preserveScroll && $('rev-category').scrollIntoView) $('rev-category').scrollIntoView({behavior:'smooth', block:'start'});
  }
  function openReviewCategory(key, preserveScroll){ renderReviewCategory(key, preserveScroll); }
  function closeReviewCategory(){
    $('rev-category').classList.add('hide');
    $('rev-category').innerHTML = '';
    $('review-heading').classList.remove('hide');
    $('rev-publish-inline').classList.remove('hide');
    $('rev-body').classList.remove('hide');
  }
  window.openReviewCategory = openReviewCategory;
  window.closeReviewCategory = closeReviewCategory;
  $('rev-body').innerHTML = `<div id="review-category-grid" aria-label="审核分类">
    ${categoryDefs.map(def=>`<article class="review-category-card ${def.cls}">
      <div><div class="review-category-card-head"><div class="review-category-card-title">${def.title}</div><div class="review-category-card-count">${def.list.length}</div></div>
      <div class="review-category-card-meta">${def.meta}</div></div>
      <div class="actions"><button class="primary mini" onclick="openReviewCategory('${def.key}')">查看本类</button></div>
    </article>`).join('')}
  </div>`;

  const pendingDisagreements = (r.pending_disagreements||[]).length;
  const triageReady = !screening.decision || triageConfirmation.status==='confirmed';
  const formalReady = screening.decision!=='recommend_mdt' || formalRecord.status==='completed';
  const canPublish = sum.pending===0 && sum.total>0 && pendingDisagreements===0 && triageReady && formalReady;
  // 所有屏幕统一使用主区发布入口。
  const inlineBox = $('rev-publish-inline');
  if(inlineBox) inlineBox.innerHTML = publishPanelHtml(sum, canPublish, 'inline');
}

/* 发布审核版 + 录入线下意见（两处入口共用同一份 HTML 与同一套接口） */
function publishPanelHtml(sum, canPublish, pfx){
  sum = sum || {};
  const screening = (S.review&&S.review.mdt_screening)||{};
  const triageConfirmation = (S.review&&S.review.triage_doctor_confirmation)||{};
  const triageReady = !screening.decision || triageConfirmation.status==='confirmed';
  const formalRecord = (S.review&&S.review.mdt_formal_record)||{};
  const formalReady = screening.decision!=='recommend_mdt' || formalRecord.status==='completed';
  const batchBlockedPending = Number(sum.batch_blocked_pending||0);
  const pendingDisagreements = Number((S.review&&S.review.pending_disagreements||[]).length||0);
  const batchAllowed = !batchBlockedPending;
  return `
    <div class="card" style="margin-top:6px;">
      <h3 style="margin-top:0;">发布审核版报告</h3>
      <div class="publish-summary-grid" aria-label="审核进度">
        <div class="publish-summary-stat"><span>医生已处理</span><strong>${sum.doctor_reviewed||sum.human_touched||0}</strong></div>
        <div class="publish-summary-stat"><span>免审自动处理</span><strong>${sum.auto_processed||0}</strong></div>
        <div class="publish-summary-stat"><span>待审核</span><strong>${sum.pending||0}</strong></div>
      </div>
      ${batchBlockedPending?`<div class="publish-blocker">还有 ${batchBlockedPending} 条必审项目需要逐条处理，批量入口已停用。</div>`:''}
      ${pendingDisagreements?`<div class="publish-blocker">还有 ${pendingDisagreements} 条正式 MDT 分歧未记录处理结果。</div>`:''}
      ${!formalReady?'<div class="publish-blocker">正式 MDT 尚未完成记录，暂不能发布。</div>':''}
      ${!triageReady?'<div class="publish-blocker">尚未完成分流确认，暂不能发布。</div>':''}
      <div class="actions">
        <button class="mini" onclick="publish(false)" ${canPublish?'':'disabled'}>确认发布审核版（${sum.pending||0} 条待审）</button>
        <button class="primary mini" onclick="publish(true)" ${sum.total&&batchAllowed&&formalReady?'':'disabled'}>处理剩余必审并发布</button>
      </div>
      <h3>录入线下实际意见</h3>
      <div class="publish-opinion-form">
        <input id="${pfx}-op-dept" placeholder="科室（如 眼科）">
        <textarea id="${pfx}-op-text" placeholder="填写线下医生意见原文"></textarea>
        <button class="mini opinion-submit" onclick="submitOpinion('${pfx}')">录入意见</button>
      </div>
      <div id="${pfx}-op-msg"></div>
    </div>`;
}

/* ===================== 审核动作 ===================== */
async function decide(itemId, action, after, reason){
  const wasInDetail = !$('rev-detail').classList.contains('hide') && S.reviewDetailItemId===itemId;
  const currentCategory = S.reviewCategoryKey || '';
  const reviewScroll = captureReviewScroll();
  const r = await api('/api/v2/case/'+S.caseId+'/decisions', {method:'POST',
    body:JSON.stringify({item_id:itemId, action:action, after:after||'', reason:reason||'',
                         reviewer: (S.me&&S.me.label)||'模拟审核员'})});
  if(r.status!==200 || !r.data.ok){ alert(r.data.error||'操作失败'); return false; }
  S.review.items = r.data.items; S.review.summary = r.data.summary;
  S.review.pending_questions = S.review.pending_questions||[];
  S.reviewActiveItemIds = Array.isArray(S.reviewActiveItemIds) ? S.reviewActiveItemIds : [];
  if(!S.reviewActiveItemIds.includes(itemId)) S.reviewActiveItemIds.push(itemId);
  await refreshHeader();
  renderReview();
  if(wasInDetail) window.openReviewDetail(itemId, 'category', true);
  else if(currentCategory) window.openReviewCategory(currentCategory, true);
  restoreReviewScroll(reviewScroll);
  return true;
}
async function submitDisagreement(disagreementId, key){
  const status = String(($('dis-status-'+key)||{}).value||'');
  const choice = String(($('dis-choice-'+key)||{}).value||'').trim();
  const reason = String(($('dis-reason-'+key)||{}).value||'').trim();
  const next = String(($('dis-next-'+key)||{}).value||'').trim();
  const r = await api('/api/v2/case/'+S.caseId+'/disagreements', {method:'POST', body:JSON.stringify({
    disagreement_id: disagreementId, status, choice, reason, next_step: next,
    reviewer:(S.me&&S.me.label)||'模拟审核员'
  })});
  const box = $('dis-msg-'+key);
  if(r.status!==200 || !r.data.ok){ if(box) box.textContent=r.data.error||'保存失败'; return; }
  if(box) { box.textContent='已保存'; box.className='tiny ok'; }
  await openCase(S.caseId);
  go('overview');
}
let modalPreviousFocus = null;
function openModal(action, itemId){
  const labels = {modify:'修改条目', reject:'驳回条目', uncertain:'标记为暂不确定', request_more_info:'请求补充资料'};
  const needAfter = action==='modify';
  modalPreviousFocus = document.activeElement;
  S.modal = {action, itemId};
  $('modal-title').textContent = labels[action] || '审核操作';
  $('modal-body').innerHTML = `
    ${needAfter?`<label id="m-after-label" for="m-after" class="muted">修改后内容（必填）</label><div id="m-after-help" class="tiny">请使用面向患者和医生的中性表述。</div><textarea id="m-after" aria-describedby="m-after-help" placeholder="改写为面向患者/医生的中性表述"></textarea>`:''}
    <label id="m-reason-label" for="m-reason" class="muted" style="margin-top:8px;">原因（修改/驳回必填，其他建议填写）</label>
    <div id="m-reason-help" class="tiny">说明依据不足、风险或需要补充的资料，便于后续追溯。</div>
    <textarea id="m-reason" aria-describedby="m-reason-help" placeholder="例如：依据不足，需补充眼底检查结果"></textarea>
    <div id="m-msg" role="alert" aria-live="assertive"></div>`;
  $('modal').classList.remove('hide');
  const first = $('m-after') || $('m-reason') || $('modal-close');
  if(first) first.focus();
}
function closeModal(){
  $('modal').classList.add('hide');
  S.modal=null;
  const previous = modalPreviousFocus;
  modalPreviousFocus = null;
  if(previous && document.contains(previous) && typeof previous.focus==='function') previous.focus({preventScroll:true});
  else if($('rev-body')){ $('rev-body').setAttribute('tabindex','-1'); $('rev-body').focus({preventScroll:true}); }
}
let modalSubmitting = false;
async function submitModal(){
  if(!S.modal || modalSubmitting) return;
  const modal = S.modal;
  modalSubmitting = true;
  modal.submitting = true;
  const controls = Array.from(document.querySelectorAll('#modal button'));
  controls.forEach(button=>{ button.disabled=true; button.setAttribute('aria-busy','true'); });
  try{
    const after = $('m-after') ? $('m-after').value.trim() : '';
    const reason = $('m-reason') ? $('m-reason').value.trim() : '';
    const ok = await decide(modal.itemId, modal.action, after, reason);
    if(ok) closeModal();
  }finally{
    if(S.modal===modal) modal.submitting=false;
    modalSubmitting = false;
    controls.forEach(button=>{ button.disabled=false; button.removeAttribute('aria-busy'); });
  }
}
async function publish(acceptAll){
  const r = await api('/api/v2/case/'+S.caseId+'/publish', {method:'POST',
    body:JSON.stringify({accept_all: !!acceptAll, reviewer:(S.me&&S.me.label)||'模拟审核员'})});
  if(r.status!==200 || !r.data.ok){ alert(r.data.error||'发布失败'); return; }
  await openCase(S.caseId);
  go('review');
  alert('已发布审核版：病例状态 → 医生已确认，报告版本 v'+r.data.report_version+'，角标已转为"已审核"。');
}
async function submitOpinion(pfx){
  pfx = pfx || 'inline';
  const dept = String(($(pfx+'-op-dept')||{}).value||'').trim();
  const text = String(($(pfx+'-op-text')||{}).value||'').trim();
  if(!text){ msg(pfx+'-op-msg','请填写意见内容'); return; }
  const r = await api('/api/v2/case/'+S.caseId+'/updates', {method:'POST',
    body:JSON.stringify({kind:'医生意见', content:text, source:'医生上传', department:dept})});
  if(r.status!==200 || !r.data.ok){ msg(pfx+'-op-msg', r.data.error||'录入失败'); return; }
  msg(pfx+'-op-msg','已录入线下医生意见，并已生成「AI 建议 vs 医生意见」对照与变化摘要','ok');
  await openCase(S.caseId); go('review');
}
async function refreshHeader(){
  const rev = await api('/api/v2/case/'+S.caseId+'/review');
  if(rev.status===200){ S.review = rev.data;
    const p=(S.caseData.payload||{}), t=p.triage||{};
    renderCaseContext(t);
  }
}

document.getElementById('doctor-login-form').addEventListener('submit', function(e){
  e.preventDefault();
  loginForm();
});

document.getElementById('modal').addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closeModal(); return; }
  if(e.key!=='Tab') return;
  const modalFocusables = Array.from(this.querySelectorAll('button:not([disabled]), textarea, input, select, [tabindex]:not([tabindex="-1"])'))
    .filter(el=>!el.closest('.hide'));
  if(!modalFocusables.length){ e.preventDefault(); $('modal').querySelector('.box').focus(); return; }
  const first = modalFocusables[0], last = modalFocusables[modalFocusables.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

/* ===================== 屏 G：审核记录与版本 ===================== */
function resetHistoryScroll(){
  // 桌面端病例内容在 .doctor-case-main 内滚动；移动端则由窗口滚动。
  // 历史详情会替换 hist-body，必须把两种滚动容器都带回详情顶部，
  // 否则“返回历史记录”按钮可能留在当前视口上方而无法点击。
  const host = document.querySelector('.doctor-case-main');
  if(host) host.scrollTop = 0;
  if(window.scrollTo) window.scrollTo(0, 0);
}
function renderHistory(){
  resetHistoryScroll();
  const h = S.audit || {};
  const decisions = h.decisions||[];
  const timeline = h.timeline||[];
  const versions = h.versions||[];
  const keyEventLabels = {
    case_submitted_for_review:'提交医生审核',
    triage_confirmation_recorded:'分流确认',
    mdt_screening_recorded:'MDT 启动判断',
    mdt_access_granted:'MDT 协作授权',
    mdt_access_pending:'MDT 协作待授权',
    mdt_formal_record_updated:'正式 MDT 记录',
    decision_recorded:'医生审核决定',
    disagreement_decision_recorded:'MDT 分歧处理',
    case_updated:'病例资料更新',
    case_state_changed:'病例流程状态变更',
    report_published:'报告发布'
  };
  const keyTimeline = timeline.filter(t=>Object.prototype.hasOwnProperty.call(keyEventLabels, String(t.event||'')));
  const actorFromDetail = detail => {
    const text = String(detail||'');
    const match = text.match(/(?:审核人|责任审核人|reviewer|source|操作人)=?([^；;，,\s]+)/i);
    return match ? match[1].trim() : '系统记录';
  };
  const eventCard = t => `<div class="history-event-card"><div class="history-event-time">${esc(t.at||'—')}</div><div class="history-event-copy"><strong>${esc(keyEventLabels[String(t.event||'')]||'关键流程')}</strong><div class="history-event-detail">${esc(t.detail||'暂无补充说明')}</div></div><div class="history-event-actor">${esc(actorFromDetail(t.detail))}</div></div>`;
  const decisionRow = (d, index) => `<div class="history-decision-row"><div class="history-decision-main"><strong>${esc(d.action_label||'审核操作')} · ${esc(d.target_label||d.target_type||'条目')}</strong><div class="history-decision-meta">${esc(d.reviewer||'医生')} · ${esc(d.created_at||'')}</div></div><button class="ghost mini" onclick="openHistoryDecision(${index})">查看处理详情</button></div>`;
  $('hist-body').innerHTML = `
    <div class="history-summary-grid"><div class="history-summary-card"><span class="history-label">当前报告</span><strong>v${esc(h.report_version||1)}</strong></div><div class="history-summary-card"><span class="history-label">报告状态</span><strong>${h.review&&h.review.published?'已发布':'待发布'}</strong></div><div class="history-summary-card"><span class="history-label">历史版本</span><strong>${versions.length} 个</strong></div></div>
    <section class="history-section"><h3>报告版本</h3>${versions.length?versions.map(v=>`<div class="history-version"><div class="history-decision-row"><div class="history-decision-main"><strong>报告版本 v${esc(v.version)}</strong><div class="history-decision-meta">${esc(v.published_by||'医生')} · ${esc(v.published_at||'—')}</div></div><button class="ghost mini" onclick="openHistoryVersion(${Number(v.version)||0})">查看报告</button></div></div>`).join(''):'<div class="doctor-empty-state">暂无已发布报告版本。</div>'}</section>
    <section class="history-section"><h3>医生处理记录</h3><div class="history-decision-list">${decisions.length?decisions.map(decisionRow).join(''):'<div class="doctor-empty-state">暂无医生处理记录。</div>'}</div></section>
    <section class="history-section"><h3>关键流程记录</h3><div class="history-event-list">${keyTimeline.length?keyTimeline.map(eventCard).join(''):'<div class="doctor-empty-state">暂无关键流程记录。</div>'}</div></section>`;
}

function openHistoryDecision(index){
  const d=(S.audit&&S.audit.decisions||[])[index]; if(!d) return;
  $('hist-body').innerHTML=`<div class="history-detail"><button class="primary review-detail-back" onclick="renderHistory()">← 返回历史记录</button><h3>${esc(d.action_label||'审核操作')} · ${esc(d.target_label||d.target_type||'条目')}</h3><div class="history-decision-meta">${esc(d.reviewer||'医生')} · ${esc(d.created_at||'')}</div>${d.before?`<h4>AI 原稿</h4><div class="history-detail-copy">${esc(d.before)}</div>`:''}${d.after?`<h4>医生版本</h4><div class="history-detail-copy">${esc(d.after)}</div>`:''}${d.reason?`<h4>处理理由</h4><div class="history-detail-copy">${esc(d.reason)}</div>`:''}</div>`;
  resetHistoryScroll();
}
function openHistoryVersion(version){
  const v=(S.audit&&S.audit.versions||[]).find(item=>Number(item.version)===Number(version)); if(!v) return;
  const report=v.summary||v.full||v.report_json;
  $('hist-body').innerHTML=`<div class="history-detail"><button class="primary review-detail-back" onclick="renderHistory()">← 返回历史记录</button><h3>报告版本 v${esc(v.version)}</h3><div class="history-decision-meta">${esc(v.published_by||'医生')} · ${esc(v.published_at||'—')}</div>${report?`<div class="history-detail-copy">${esc(typeof report==='string'?report:JSON.stringify(report,null,2))}</div>`:'<div class="doctor-empty-state">该版本暂无报告正文。</div>'}</div>`;
  resetHistoryScroll();
}
window.openHistoryDecision=openHistoryDecision;
window.openHistoryVersion=openHistoryVersion;

/* 启动：优先恢复已有跨页会话，否则显示登录页 */
restoreSession();
</script>
