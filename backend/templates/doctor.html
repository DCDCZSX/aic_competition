<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多学科就医智助系统 · 医生工作台</title>
<link rel="stylesheet" href="/static/css/dsh.css">
<style>
  /* 医生工作台专用样式（公共 token 与组件在 dsh.css） */
  /* 左轨只承担筛选和导航；病例队列在主区集中展示 */
  .rail-filters{display:flex;flex-direction:column;gap:4px;}
  .rail-filters .filter-link{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border:0;border-radius:var(--br-8);background:transparent;color:var(--ink2);font:inherit;font-size:var(--body-3);text-align:left;}
  .rail-filters .filter-link:hover{background:var(--gray-100);}
  .rail-filters .filter-link.on{background:var(--gray-000);border:1px solid var(--gray-200);color:var(--ink);font-weight:600;}
  .queue-more-filters{margin-top:var(--sp-8);border-top:1px solid var(--line);padding-top:var(--sp-8);}
  .queue-more-filters>summary{padding:8px 10px;min-height:44px;color:var(--ink2);font-size:var(--body-3);cursor:pointer;}
  .queue-more-filters>summary:hover{color:var(--ink);}
  .queue-more-filters>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:var(--br-8);}
  .queue-more-filter-list{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
  .rail-sec{border-top:1px solid var(--line);margin-top:var(--sp-12);padding-top:var(--sp-12);}
  .view-nav{display:flex;flex-direction:column;gap:2px;}
  .view-nav a,.view-nav .nav-link{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    width:100%;padding:8px 12px;border:0;border-radius:var(--br-8);background:transparent;
    color:var(--ink2);font:inherit;font-size:var(--body-3);text-align:left;
  }
  .view-nav a:hover,.view-nav .nav-link:hover{background:var(--gray-100);text-decoration:none;}
  .view-nav a.on,.view-nav .nav-link.on{background:var(--gray-000);border:1px solid var(--gray-200);color:var(--ink);font-weight:500;}
  .view-nav a.dis,.view-nav .nav-link.dis{color:var(--ink3);cursor:not-allowed;}
  /* 屏幕 E：三栏工作台已有通用 .mdt；屏幕 F：审核分类先以卡片入口呈现 */
  #rev-body{display:grid;gap:var(--sp-12);grid-template-columns:1fr;}
  #rev-body .item{margin-bottom:0;}
  /* 病例队列：单列表格，保证病例、风险和待办量在同一视觉层级 */
  .queue-table{border:1px solid var(--line);border-radius:var(--br-12);overflow:hidden;background:var(--gray-000);}
  .queue-head,.queue-row{display:grid;grid-template-columns:minmax(180px,1.25fr) minmax(220px,1.7fr) 100px minmax(150px,1fr) 150px;gap:14px;align-items:center;padding:13px 16px;}
  #list-body{display:grid;grid-template-columns:1fr;}
  .queue-head{background:var(--gray-100);color:var(--ink3);font-size:var(--micro);font-weight:600;letter-spacing:.02em;}
  .queue-entry{border-top:1px solid var(--line);}
  .queue-row{cursor:pointer;transition:background .15s ease,box-shadow .15s ease;}
  .queue-row:hover{background:var(--surface-warm);box-shadow:inset 3px 0 0 var(--accent);}
  .queue-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .queue-details{padding:0 16px 12px;background:var(--surface-subtle);}
  .queue-details>summary{display:inline-flex;align-items:center;min-height:30px;color:var(--accent);font-size:var(--micro);cursor:pointer;}
  .queue-details>summary:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:var(--br-6);}
  .queue-details-body{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px;}
  .queue-detail{display:inline-flex;align-items:center;gap:5px;color:var(--ink2);font-size:var(--micro);}
  .q-id{font-weight:650;color:var(--ink);}.q-main{min-width:0;}.q-main .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q-risk{font-weight:650;}.q-risk.high{color:var(--danger);}.q-risk.medium{color:var(--warn);}.q-risk.low{color:var(--ok);}
  .queue-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .pager-buttons{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}.pager-buttons button{min-width:34px;}.pager-buttons button.on{background:var(--ink);color:var(--gray-000);}
  #review-category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-12);}
  .review-category-card{display:flex;flex-direction:column;justify-content:space-between;min-height:150px;padding:var(--sp-16);border:1px solid var(--line);border-radius:var(--br-12);background:var(--gray-000);box-shadow:0 1px 2px rgba(26,32,35,.03);}
  .review-category-card:hover{border-color:var(--accent);box-shadow:0 4px 14px rgba(26,32,35,.08);}
  .review-category-card.sample{background:var(--surface-warm);}.review-category-card.auto{background:var(--surface-subtle);}
  .review-category-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .review-category-card-title{font-size:var(--body-1);font-weight:650;line-height:1.4;}
  .review-category-card-count{font-size:var(--headline-3);font-weight:700;line-height:1;color:var(--ink);}
  .review-category-card-meta{margin-top:8px;color:var(--ink2);font-size:var(--body-3);line-height:1.5;}
  .review-category-card .actions{margin-top:var(--sp-16);}
  .review-category-view{margin-top:var(--sp-12);}
  .publish-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 16px;}
  .publish-summary-stat{padding:12px 14px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--surface-subtle);}
  .publish-summary-stat strong{display:block;margin-top:4px;font-size:var(--headline-3);line-height:1.1;color:var(--ink);}
  .publish-summary-stat span{font-size:var(--body-3);color:var(--ink2);}
  .publish-blocker{margin:10px 0;padding:10px 12px;border-left:3px solid var(--warn);background:var(--surface-warm);font-size:var(--body-3);line-height:1.55;color:var(--ink);}
  .publish-opinion-form{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch;margin-top:12px;}
  .publish-opinion-form input,.publish-opinion-form textarea{width:100%;box-sizing:border-box;font:inherit;}
  .publish-opinion-form textarea{min-height:120px;resize:vertical;}
  .publish-opinion-form .opinion-submit{min-height:44px;justify-self:start;}
  .review-level-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;}
  .review-level-summary>div{padding:10px 12px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--gray-000);}
  .review-level-summary strong{display:block;margin-top:3px;font-size:var(--body-1);}
  .review-decision-card{padding:14px 16px;background:var(--gray-000);transition:background .18s ease,border-color .18s ease,box-shadow .18s ease;}
  .review-decision-card:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(196,104,73,.12);}
  .review-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  .review-card-title{min-width:0;line-height:1.45;}
  .review-card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;}
  .review-card-summary{margin:10px 0 0;padding:10px 12px;border-radius:var(--br-8);background:var(--surface-subtle);line-height:1.6;}
  .review-card-summary .muted{margin-right:6px;}
  .review-card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .review-complete-label{display:inline-flex;align-items:center;min-height:36px;padding:8px 12px;border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ok);font-size:var(--body-3);font-weight:650;}
  .review-detail{margin-top:var(--sp-12);}
  .review-detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .review-detail-content{display:grid;gap:var(--sp-16);margin-top:var(--sp-16);}
  .review-detail-content .review-copy{font-size:var(--body-2);line-height:1.75;white-space:pre-wrap;}
  .review-detail-content .review-meta{font-size:var(--caption);line-height:1.65;color:var(--ink2);}
  .review-detail-section{padding:var(--sp-16);border:1px solid var(--line);border-radius:var(--br-12);background:var(--gray-000);}
  .review-detail-section h3{margin:0 0 var(--sp-8);font-size:var(--body-1);}
  .review-detail-back{display:inline-flex;align-items:center;min-height:42px;margin-bottom:var(--sp-12);padding:9px 16px;font-size:var(--body-3);font-weight:650;}
  @media (max-width:960px){ #review-category-grid{grid-template-columns:repeat(2,minmax(0,1fr));}.publish-summary-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
  @media (max-width:720px){.publish-opinion-form{grid-template-columns:1fr;}.publish-opinion-form .opinion-submit{width:100%;}}
  @media (max-width:560px){ #review-category-grid{grid-template-columns:1fr;}.review-level-summary,.publish-summary-grid{grid-template-columns:1fr;}}
  .queue-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:0;}
  .queue-summary{display:grid;gap:10px;margin:14px 0 18px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--surface-subtle);}
  .queue-page-note{font-size:var(--body-3);line-height:1.5;color:var(--ink2);}
  .queue-tier-summary{display:grid;grid-template-columns:repeat(7,minmax(86px,1fr));gap:8px;}
  .queue-tier-stat{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:var(--br-6);background:var(--gray-000);}
  .queue-tier-stat span{font-size:var(--body-3);color:var(--ink2);white-space:nowrap;}
  .queue-tier-stat strong{font-size:var(--body-1);line-height:1;color:var(--ink);}
  @media (max-width:960px){.queue-tier-summary{grid-template-columns:repeat(4,minmax(110px,1fr));}}
  @media (max-width:560px){.queue-tier-summary{grid-template-columns:repeat(2,minmax(0,1fr));}}
  .doctor-card-accent{margin:0 0 var(--sp-16);border-left:3px solid var(--accent);}
  .doctor-card-info{margin:0 0 var(--sp-16);border-left:3px solid var(--info);}
  .inline-between{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;}
  .inline-between-tight{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;}
  .inline-end{display:flex;justify-content:flex-end;gap:8px;align-items:center;}
  .inline-wrap{display:flex;gap:8px;flex-wrap:wrap;}
  .mdt-packet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:10px;}
  .opinion-fields{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .doctor-case-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:var(--sp-8);padding:4px 0 8px;}
  .back-to-queue{min-width:136px;padding:8px 16px;font-size:var(--body-3);font-weight:650;box-shadow:0 2px 8px rgba(177,82,57,.16);}
  .doctor-case-header-copy{min-width:0;}
  .doctor-case-title-row{display:flex;align-items:center;gap:clamp(24px,6vw,72px);width:100%;flex-wrap:wrap;}
  .doctor-case-header[data-compact="doctor-case-header-compact"] #case-heading{margin:0;font-size:var(--headline-3);line-height:1.15;}
  .doctor-case-context-strip{display:inline-flex;align-items:center;gap:12px;max-width:100%;margin-left:auto;padding:8px 12px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ink2);font-size:var(--body-3);line-height:1.35;}
  .doctor-case-context-id{font-weight:650;color:var(--ink);}
  .doctor-case-context-fact{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap;}
  .doctor-case-context-label{color:var(--ink3);font-size:var(--micro);}
  .doctor-case-context-divider{width:1px;height:18px;background:var(--line);}
  @media (max-width:560px){
    .doctor-case-title-row{gap:10px;}
    .doctor-case-context-strip{display:flex;width:100%;box-sizing:border-box;flex-wrap:wrap;margin-left:0;}
    .doctor-case-context-divider{display:none;}
  }
  .doctor-case-header .lede{max-width:var(--text-width-body);}
  .doctor-case-layout{display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--sp-24);align-items:start;}
  .doctor-case-nav{display:flex;flex-direction:column;gap:3px;position:sticky;top:var(--sp-16);min-width:0;padding-right:var(--sp-12);border-right:1px solid var(--line);}
  .doctor-case-nav .nav-link{width:100%;white-space:nowrap;}
  .doctor-case-main{grid-column:2;min-width:0;}
  /* 病例详情的标题只承担定位作用，压缩上下留白把首屏空间留给病例内容。 */
  body.doctor-case-mode #doctor-shell.has-case{padding-top:12px;}
  body.doctor-case-mode .doctor-case-header{margin-bottom:0;padding:0;min-height:0;}
  body.doctor-case-mode .doctor-case-header[data-compact="doctor-case-header-compact"] #case-heading{font-size:clamp(24px,20px + .55vw,30px);line-height:1.1;}
  @media (min-width:961px){
    body.doctor-case-mode{overflow:hidden;}
    #doctor-shell.has-case{height:calc(100vh - var(--nav-h));min-height:0;overflow:hidden;padding-bottom:var(--sp-24);}
    #doctor-shell.has-case .work{min-height:0;overflow:hidden;}
    #doctor-shell.has-case .doctor-case-layout{min-height:0;flex:1;}
    #doctor-shell.has-case .doctor-case-main{min-height:0;max-height:calc(100vh - var(--nav-h) - 112px);overflow-y:auto;overscroll-behavior:contain;padding-right:var(--sp-8);scrollbar-gutter:stable;}
    #doctor-shell.has-case .doctor-case-nav{max-height:calc(100vh - var(--nav-h) - 112px);overflow-y:auto;overscroll-behavior:contain;}
  }
  .shell.has-case{grid-template-columns:minmax(0,1fr);}
  .shell.has-case .rail-left,.shell.has-case .rail-right{display:none;}
  .shell.has-case .work{grid-column:1;}
  .doctor-queue-mode .doctor-case-header,.doctor-queue-mode .doctor-case-nav{display:none;}
  .doctor-queue-mode .doctor-case-layout{display:block;}
  .publish-inline{display:block;}
  .doctor-decision-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:var(--sp-16);}
  .doctor-decision-summary>div{padding:12px 14px;background:var(--surface-subtle);border-radius:var(--br-8);}
  .mdt-results{display:grid;gap:var(--sp-16);}
  .mdt-result-section{padding-top:var(--sp-4);}
  .mdt-result-section h4,.mdt-process h3{margin:0 0 8px;font-size:var(--body-1);}
  .mdt-result-list{display:grid;gap:6px;}
  .mdt-result-item{padding:10px 12px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--gray-000);}
  .mdt-result-item strong{font-weight:650;color:var(--ink);}
  .mdt-result-item p{margin:4px 0 0;color:var(--ink2);font-size:var(--body-3);line-height:1.55;}
  .mdt-result-item.question{border-left:3px solid var(--warn);}
  .mdt-result-empty{padding:10px 0;color:var(--ink3);font-size:var(--body-3);}
  .mdt-process{border-top:1px solid var(--line);padding-top:var(--sp-16);}
  .mdt-process-list{display:grid;gap:0;margin:0;padding:0;list-style:none;}
  .mdt-process-step{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;position:relative;padding:0 0 var(--sp-16);}
  .mdt-process-step:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:0;width:1px;background:var(--line);}
  .mdt-process-marker{z-index:1;display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--gray-000);color:var(--accent);font-weight:650;font-size:var(--body-3);}
  .mdt-process-content{min-width:0;padding:2px 0 0;}
  .mdt-process-content h4{margin:0;font-size:var(--body-1);font-weight:650;}
  .mdt-process-content>.tiny{margin:3px 0 8px;}
  .mdt-specialty-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
  .mdt-specialty-item{padding:12px 14px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--surface-subtle);}
  .mdt-specialty-item .tiny{margin-top:4px;line-height:1.5;}
  .mdt-specialty-card{padding:16px;border:1px solid var(--line);border-radius:var(--br-12);background:var(--gray-000);}
  .mdt-specialty-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .mdt-specialty-heading strong{font-size:var(--body-1);font-weight:700;}
  .mdt-specialty-focus{padding:10px 12px;border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ink2);font-size:var(--body-3);line-height:1.6;}
  .mdt-specialty-sections{display:grid;gap:10px;margin-top:12px;}
  .mdt-specialty-section{padding-top:10px;border-top:1px solid var(--line);}
  .mdt-specialty-section-title{display:flex;align-items:center;gap:6px;margin-bottom:6px;color:var(--ink);font-size:var(--body-3);font-weight:700;}
  .mdt-specialty-section-title .count{color:var(--ink3);font-size:var(--caption);font-weight:500;}
  .mdt-specialty-copy{margin:0;color:var(--ink2);font-size:var(--body-3);line-height:1.65;}
  .mdt-specialty-copy ul{margin:0;padding-left:20px;display:grid;gap:4px;}
  .mdt-specialty-copy li{padding-left:2px;}
  .mdt-specialty-inferences .mdt-specialty-copy{display:grid;gap:7px;}
  .mdt-inference{padding:8px 10px;border-radius:var(--br-8);background:var(--surface-subtle);}
  .mdt-specialty-checks{border-left:3px solid var(--warn);padding-left:10px;}
  .mdt-specialty-gaps{border-left:3px solid var(--gray-300);padding-left:10px;}
  .mdt-specialty-more{margin-top:6px;font-size:var(--caption);}
  .mdt-specialty-more summary{color:var(--accent);cursor:pointer;}
  .mdt-specialty-empty{color:var(--ink3);font-size:var(--body-3);}
  .mdt-ai-boundary{margin-top:12px;line-height:1.6;}
  .mdt-prep-question-list{display:grid;gap:6px;}
  .mdt-prep-question{padding:9px 11px;border-left:3px solid var(--info);border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ink2);font-size:var(--body-3);line-height:1.55;}
  .mdt-formal-record,.mdt-formal-route{margin-top:var(--sp-16);padding:16px;border:1px solid var(--line);border-radius:var(--br-12);background:var(--gray-000);}
  .mdt-formal-context{margin:12px 0;padding:10px 12px;border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ink2);font-size:var(--body-3);line-height:1.7;}
  .mdt-formal-route{border-left:3px solid var(--info);}.mdt-route-ok{border-left-color:var(--ok);}.mdt-route-warn{border-left-color:var(--warn);}.mdt-route-danger{border-left-color:var(--danger);}
  .mdt-formal-route h3{margin:0 0 8px;}.mdt-formal-route p{margin:6px 0 0;color:var(--ink2);font-size:var(--body-3);line-height:1.6;}
  .mdt-formal-disagreements{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);}
  .mdt-formal-disagreements h4{margin:0 0 5px;}
  .mdt-formal-disagreement{margin-top:10px;}
  .mdt-process-note{padding:10px 12px;border-radius:var(--br-8);background:var(--surface-subtle);color:var(--ink2);font-size:var(--body-3);}
  @media (max-width:720px){.mdt-specialty-list{grid-template-columns:1fr;}.mdt-specialty-card{padding:13px;}}
  .triage-department-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;border-top:1px solid var(--line);margin-bottom:var(--sp-16);}
  .triage-department-item{padding:12px 2px;border-bottom:1px solid var(--line);}
  .triage-department-item .tiny{margin-top:5px;max-width:var(--text-width-body);font-size:var(--body-3);color:var(--ink2);}
  .triage-evidence-label{margin-top:12px;font-size:var(--body-3);font-weight:650;color:var(--ink2);}
  .triage-evidence-list{display:grid;gap:6px;margin-top:7px;padding:0;list-style:none;}
  .triage-evidence-item{padding:8px 10px;border:1px solid var(--line);border-radius:var(--br-6);background:var(--surface-subtle);font-size:var(--body-3);line-height:1.55;color:var(--ink);}
  .triage-confirmation-card{margin:var(--sp-16) 0;padding:16px;border:1px solid var(--info);border-radius:var(--br-12);background:var(--surface-subtle);}
  .triage-secondary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;flex:1;min-width:0;}
  .triage-secondary-option{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;min-width:0;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--br-8);background:var(--gray-000);cursor:pointer;}

  .overview-fact-content{min-width:0;}

    .queue-row>div:nth-child(n+3){font-size:var(--micro);}

          background:var(--gray-000);padding:var(--sp-12);}

<body>

<!-- ===================== 屏 0：登录 ===================== -->
<div id="login" class="auth">
  <header class="auth-topbar">
    <a class="auth-topbar-brand" href="/" aria-label="返回多学科就医智助系统首页">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
        <rect x="1" y="1" width="26" height="26" rx="8" fill="#141413"/>
        <path d="M14 7.5v13M7.5 14h13" stroke="#d97757" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="14" cy="14" r="3.2" fill="#faf9f5"/>
      </svg>
      <span>多学科就医智助系统</span>
    </a>
    <a class="auth-home-link" href="/">返回主页</a>
  </header>
  <div class="auth-main">
    <div class="auth-panel">
      <h1>进入医生工作台</h1>
      <p class="muted">从风险优先队列开始审核。</p>

      <form id="doctor-login-form" class="auth-form">
        <label class="sr" for="login-user">账号</label>
        <input id="login-user" placeholder="账号" autocomplete="username">
        <label class="sr" for="login-pass">密码</label>
        <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
        <button class="primary" type="submit">登录</button>
      </form>

      <div id="login-msg" class="banner danger hide" role="alert" aria-live="assertive"></div>
      <a class="auth-switch" href="/patient">进入患者端</a>
    </div>
  </div>
</div>

<!-- ===================== 医生工作台主体 ===================== -->
<div id="app" class="app hide">
  <header class="appbar">
    <div class="appbar-inner">
      <div class="ab-left">
        <a class="ab-brand" href="/">
          <svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true">
            <rect x="1" y="1" width="26" height="26" rx="8" fill="#141413"/>
            <path d="M14 7.5v13M7.5 14h13" stroke="#d97757" stroke-width="2.2" stroke-linecap="round"/>
            <circle cx="14" cy="14" r="3.2" fill="#faf9f5"/>
          </svg>
          <span class="name">多学科就医智助系统</span>
        </a>
        <span class="tag">医生工作台</span>
      </div>
      <div class="ab-right">
        <span class="ident muted" id="ident">—</span>
        <button class="ghost btn-sm" onclick="logout()">退出登录</button>
      </div>
    </div>
  </header>

  <div id="doctor-shell" class="shell">
    <!-- 左轨：队列筛选 + 视图导航；病例本体在主区分页展示 -->
    <aside class="rail rail-left">
      <div class="rail-title">队列筛选</div>
      <div class="rail-filters" id="rail-filters"><div class="skeleton">加载中…</div></div>
      <div class="rail-foot">
        <div class="progress"><i id="rev-bar" style="width:0%"></i></div>
        <div class="tiny" id="rev-note">未选择病例</div>
      </div>
    </aside>

    <main class="work">
      <div class="doctor-case-header" data-compact="doctor-case-header-compact">
        <div class="doctor-case-header-copy">
          <div class="doctor-case-title-row">
            <h1 id="case-heading">病例审阅</h1>
            <div class="doctor-case-context-strip" role="status" aria-live="polite">
              <strong id="case-context-id" class="doctor-case-context-id mono">未选择病例</strong>
              <span class="doctor-case-context-divider" aria-hidden="true"></span>
              <span class="doctor-case-context-fact"><span class="doctor-case-context-label">类型</span><strong id="case-context-type">—</strong></span>
              <span class="doctor-case-context-divider" aria-hidden="true"></span>
              <span class="doctor-case-context-fact"><span class="doctor-case-context-label">可靠性</span><strong id="case-context-reliability">—</strong></span>
            </div>
          </div>
        </div>
        <button type="button" class="primary btn-sm back-to-queue" onclick="go('list')">← 返回病例队列</button>
      </div>
      <div class="doctor-case-layout">
      <nav class="doctor-case-nav view-nav" id="nav" aria-label="病例处理阶段">
        <button type="button" class="nav-link" onclick="go('list')" data-s="list" aria-current="page">病例队列</button>
        <button type="button" class="nav-link dis" onclick="navCase('overview')" data-s="overview" disabled>病例摘要</button>
        <button type="button" class="nav-link dis" onclick="navCase('triage')" data-s="triage" disabled>分流确认</button>
        <button type="button" class="nav-link dis" onclick="navCase('mdt')" data-s="mdt" disabled>MDT 协作</button>
        <button type="button" class="nav-link dis" onclick="navCase('review')" data-s="review" disabled>报告审核</button>
        <button type="button" class="nav-link dis" onclick="navCase('history')" data-s="history" disabled>历史记录</button>
      </nav>
      <div class="doctor-case-main">
      <section id="s-list" class="card">
        <h2>待审队列（风险优先）</h2>
        <div class="queue-toolbar">
          <select id="f-state" style="width:auto;" onchange="setQueueState(this.value)">
            <option value="">全部状态</option>
            <option value="awaiting_doctor">AI 分析完成 / 待医生审核</option>
            <option value="awaiting_recheck">新资料进入后待复核</option>
            <option value="need_more_info">退回补资料</option>
            <option value="doctor_confirmed">医生已确认</option>
          </select>
          <select id="f-sort" style="width:auto;" onchange="setQueueSort(this.value)">
            <option value="risk">风险优先</option>
            <option value="pending">待处理量优先</option>
            <option value="updated">最近更新</option>
          </select>
          <select id="f-page-size" style="width:auto;" onchange="setQueuePageSize(this.value)">
            <option value="20">每页 20 例</option>
            <option value="50">每页 50 例</option>
          </select>
          <button class="ghost mini" onclick="loadList({keepPage:true})">刷新</button>
          <button class="ghost mini" onclick="analyzePending()">批量补齐分析</button>
        </div>
        <div class="queue-summary" aria-live="polite">
          <div id="list-note" class="queue-page-note"></div>
          <div id="queue-tier-summary" class="queue-tier-summary" aria-label="审核分类数量"></div>
        </div>
        <div id="list-body"><div class="skeleton">加载中…</div></div>
        <div id="list-pager" class="queue-pager"></div>
      </section>

      <section id="s-overview" class="card hide">
        <h2 id="ov-title">病例总览</h2>
        <div id="ov-body"></div>
      </section>

      <section id="s-triage" class="card hide">
        <h2>科室与判断依据</h2>
        <div id="tri-body"></div>
      </section>

      <section id="s-mdt" class="card hide">
        <h2>MDT 协作</h2>
        <div class="tiny" style="margin-bottom:var(--sp-16);">先查看 AI 多专科预分析，再由医生决定是否启动正式 MDT；正式会诊记录与报告审核分开留痕。</div>
        <div id="mdt-body"></div>
      </section>

      <section id="s-review" class="card hide">
        <h2 id="review-heading">报告审核</h2>
        <div id="rev-body"></div>
        <div id="rev-category" class="review-category-view hide"></div>
        <div id="rev-detail" class="review-detail hide"></div>
        <div id="rev-publish-inline" class="publish-inline"></div>
      </section>

      <section id="s-history" class="card hide">
        <h2>审核记录与版本</h2>
        <div id="hist-body"></div>
      </section>
      </div>
      </div>
    </main>

  </div>
</div>

<!-- 修改/驳回弹窗 -->
<div id="modal" class="modal hide" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="box" tabindex="-1">
    <h2 id="modal-title">审核操作</h2>
    <div id="modal-body"></div>
    <div class="actions">
      <button id="modal-close" class="ghost" type="button" onclick="closeModal()">取消</button>
      <button class="primary" onclick="submitModal()">确认提交</button>
    </div>
  </div>
</div>

<script>
/* ===================== 状态与工具 ===================== */
const S = { token:'', me:null, cases:[], caseId:'', caseData:null, caseRole:'', review:null,
            audit:null, screen:'list', modal:null, mdtTimer:null, mdtPlayback:null,
            queue:{filter:'', sort:'risk', state:'', page:1, pageSize:20, total:0, hasMore:false,
                   scroll:0, requestId:0} };

const PRIMARY_QUEUE_FILTERS = [
  {key:'', label:'全部病例'},
  {key:'doctor_pending', label:'待我处理'},
  {key:'recheck', label:'资料更新待复核'}
];
const MORE_QUEUE_FILTERS = [
  {key:'conflict', label:'存在分歧'},
  {key:'gaps', label:'证据缺口'},
  {key:'analysis_failed', label:'分析异常'},
  {key:'low_reliability', label:'可靠性较低'},
  {key:'exempt', label:'免审（自动）'}
];

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(id){ return document.getElementById(id); }
function msg(id, text, cls){
  const el=$(id); if(!el) return;
  const tone=cls||'danger';
  el.className='banner '+tone;
  el.setAttribute('role', tone==='ok'?'status':'alert');
  el.setAttribute('aria-live', tone==='ok'?'polite':'assertive');
  el.textContent=text; el.classList.remove('hide');
}

async function api(path, opt){
  opt = opt || {};
  const headers = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
  if(S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const res = await fetch(path, Object.assign({}, opt, {headers}));
  let data = null;
  try{ data = await res.json(); }catch(e){ data = {}; }
  return {status:res.status, data};
}

/* ===================== 登录 ===================== */
let loginBusy = false;
async function loginForm(){
  if(loginBusy) return;
  loginBusy = true;
  const submit = document.querySelector('#doctor-login-form button[type="submit"]');
  const originalLabel = submit ? submit.textContent : '';
  if(submit){ submit.disabled = true; submit.setAttribute('aria-busy','true'); submit.textContent='正在登录…'; }
  try{
    const username = $('login-user').value.trim(), password = $('login-pass').value;
    const r = await api('/api/login', {method:'POST', body:JSON.stringify({username, password})});
    if(r.status!==200){ showLoginError(r.data.error||'登录失败'); return; }
    const d = r.data.session || {};
    if(d.role !== 'doctor'){ showLoginError('该账号不是医生角色，无法进入审核台'); return; }
    S.token = d.token; S.me = d; enterApp();
  }finally{
    loginBusy = false;
    if(submit){ submit.disabled = false; submit.removeAttribute('aria-busy'); submit.textContent=originalLabel; }
  }
}
function showLoginError(text){
  msg('login-msg', text);
  const user = $('login-user');
  if(user) user.focus();
}
async function logout(){
  clearInterval(S.mdtTimer); S.mdtTimer=null; S.mdtPlayback=null;
  await api('/api/logout', {method:'POST', body:JSON.stringify({token:S.token})});
  try{ localStorage.removeItem('dsh_session'); }catch(e){}
  S.token=''; S.me=null; $('app').classList.add('hide'); $('login').classList.remove('hide');
  document.body.classList.remove('doctor-queue-mode');
  document.body.classList.remove('doctor-case-mode');
  $('case-context-id').textContent='未选择病例';
  $('case-context-type').textContent='—';
  $('case-context-reliability').textContent='—';
  enableCaseNav(false); S.caseId='';
  $('doctor-shell').classList.remove('has-case');
  document.body.classList.remove('doctor-case-mode');
  const rf=$('rail-filters'); if(rf) rf.innerHTML='';
}
function enterApp(){
  // 跨页会话：登录后写入，供刷新与两端跳转复用
  try{ localStorage.setItem('dsh_session', JSON.stringify({token:S.token, role:'doctor',
        username:S.me.username, label:S.me.label, department_code:S.me.department_code||'',
        department_name:S.me.department_name||'', access_scope:S.me.access_scope||'department'})); }catch(e){}
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  $('doctor-shell').classList.remove('has-case');
  document.body.classList.remove('doctor-case-mode');
  document.body.classList.add('doctor-queue-mode');
  const department = S.me.department_name || S.me.department_code;
  $('ident').textContent = (S.me.label||'模拟审核员') + ' · ' + S.me.username +
    (department ? ' · ' + department : '');
  loadList({resetPage:true});
}
/* 跨页会话恢复：已有医生会话可复用；非医生会话忽略 */
function restoreSession(){
  let s=null;
  try{ s = JSON.parse(localStorage.getItem('dsh_session')||'null'); }catch(e){ return false; }
  if(!s || !s.token || s.role!=='doctor') return false;
  S.token=s.token; S.me={username:s.username, label:s.label, role:s.role,
    department_code:s.department_code||'', department_name:s.department_name||'',
    access_scope:s.access_scope||'department'};
  enterApp();
  return true;
}

/* ===================== 导航 ===================== */
function go(screen){
  if(S.screen==='list' && screen!=='list') S.queue.scroll = window.scrollY || 0;
  if(screen==='list'){
    $('doctor-shell').classList.remove('has-case');
    document.body.classList.remove('doctor-case-mode');
  }
  S.screen = screen;
  document.body.classList.toggle('doctor-queue-mode', screen==='list');
  document.body.classList.toggle('doctor-case-mode', screen!=='list' && !!S.caseId);
  ['list','overview','triage','mdt','review','history'].forEach(s=>{
    $('s-'+s).classList.toggle('hide', s!==screen);
  });
  document.querySelectorAll('#nav [data-s]').forEach(a=>{
    const active = a.dataset.s===screen;
    a.classList.toggle('on', active);
    if(active) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  if(screen==='list') loadList({keepPage:true}).then(()=>{
    if(S.queue.scroll) window.scrollTo({top:S.queue.scroll, behavior:'instant'});
  });
  if(screen==='overview') renderOverview();
  if(screen==='triage') renderTriage();
  if(screen==='mdt') renderMdt();
  if(screen==='review') renderReview();
  if(screen==='history') renderHistory();
}
function navCase(screen){
  if(!S.caseId){ return; }
  go(screen);
}
function enableCaseNav(on){
  document.querySelectorAll('#nav [data-s]').forEach(a=>{
    if(a.dataset.s!=='list'){
      a.classList.toggle('dis', !on);
      a.disabled=!on;
      a.setAttribute('aria-disabled', String(!on));
    }
  });
}

/* ===================== 屏 A：病例列表 ===================== */
function renderQueueFilters(){
  const rail=$('rail-filters'); if(!rail) return;
  const counts=(S.queueMeta&&S.queueMeta.filters)||{};
  const previousMore=$('queue-more-filters');
  const activeMore=MORE_QUEUE_FILTERS.find(f=>f.key===S.queue.filter);
  const showMore=!!activeMore || !!(previousMore&&previousMore.open);
  const renderFilter=f=>`
    <button type="button" class="filter-link ${S.queue.filter===f.key?'on':''}" aria-pressed="${S.queue.filter===f.key}" onclick="setQueueFilter('${esc(f.key)}');">
      <span>${esc(f.label)}</span><span class="tiny mono">${esc(counts[f.key||'all']!=null?counts[f.key||'all']:0)}</span>
    </button>`;
  rail.innerHTML = PRIMARY_QUEUE_FILTERS.map(renderFilter).join('') + `
    <details id="queue-more-filters" class="queue-more-filters" ${showMore?'open':''}>
      <summary>更多筛选${activeMore?` · ${esc(activeMore.label)}`:''}</summary>
      <div class="queue-more-filter-list">${MORE_QUEUE_FILTERS.map(renderFilter).join('')}</div>
    </details>`;
}
function renderPager(){
  const el=$('list-pager'); if(!el) return;
  const total=Number(S.queue.total||0), size=Number(S.queue.pageSize||20), page=Number(S.queue.page||1);
  const pages=Math.max(1, Math.ceil(total/size));
  if(!total){ el.innerHTML=''; return; }
  const start=(page-1)*size+1, end=Math.min(page*size,total);
  const nums=[];
  const lo=Math.max(1,page-2), hi=Math.min(pages,page+2);
  for(let p=lo;p<=hi;p++) nums.push(`<button class="ghost mini ${p===page?'on':''}" onclick="goQueuePage(${p})" ${p===page?'aria-current="page"':''}>${p}</button>`);
  el.innerHTML=`<div class="pager-summary tiny">显示 ${start}–${end} / 共 ${total} 例</div>
    <div class="pager-buttons"><button class="ghost mini" onclick="goQueuePage(${page-1})" ${page<=1?'disabled':''}>上一页</button>
      ${nums.join('')}<button class="ghost mini" onclick="goQueuePage(${page+1})" ${page>=pages?'disabled':''}>下一页</button></div>`;
}
function setQueueFilter(filter){
  S.queue.filter=filter||''; S.queue.page=1;
  if(S.screen!=='list'){ go('list'); } else { loadList({keepPage:true}); }
}
function setQueueState(state){ S.queue.state=state||''; S.queue.page=1; loadList({keepPage:true}); }
function setQueueSort(sort){ S.queue.sort=sort||'risk'; S.queue.page=1; loadList({keepPage:true}); }
function setQueuePageSize(size){ S.queue.pageSize=Math.max(1,Math.min(100,Number(size)||20)); S.queue.page=1; loadList({keepPage:true}); }
function goQueuePage(page){
  const pages=Math.max(1,Math.ceil(Number(S.queue.total||0)/Number(S.queue.pageSize||20)));
  S.queue.page=Math.max(1,Math.min(pages,Number(page)||1));
  loadList({keepPage:true});
}
async function loadList(options){
  options=options||{};
  if(options.resetPage) S.queue.page=1;
  const state = S.queue.state || (($('f-state')||{}).value||'');
  const sort = S.queue.sort || (($('f-sort')||{}).value||'risk');
  const pageSize = Number(S.queue.pageSize||(($('f-page-size')||{}).value)||20);
  const offset = (Math.max(1,Number(S.queue.page)||1)-1)*pageSize;
  const q = new URLSearchParams({limit:String(pageSize), offset:String(offset), sort, state});
  if(S.queue.filter) q.set('filter',S.queue.filter);
  const requestId=++S.queue.requestId;
  const r = await api('/api/v2/cases?'+q.toString());
  if(requestId!==S.queue.requestId) return;
  if(r.status!==200){ $('list-body').innerHTML = `<div class="banner danger">${esc(r.data.error||'加载失败')}</div>`; return; }
  S.cases = r.data.cases || [];
  S.queue.total=Number(r.data.total||0); S.queue.hasMore=!!r.data.has_more;
  S.queueMeta={filters:r.data.filters||{}, sorts:r.data.sorts||{}, reviewSummary:r.data.review_summary||{}};
  if($('f-state')) $('f-state').value=state;
  if($('f-sort')) $('f-sort').value=sort;
  if($('f-page-size')) $('f-page-size').value=String(pageSize);
  const queueSummary=S.queueMeta.reviewSummary||{};
  $('list-note').textContent = S.queue.total
    ? `第 ${S.queue.page} 页 · 风险优先展示高风险和待医生处理项`
    : '暂无匹配病例';
  const tierStats = [
    ['必审', 'required'], ['建议抽查', 'sample'], ['自动处理', 'automatic'],
    ['高风险', 'high_risk'], ['冲突', 'conflict'], ['分析失败', 'analysis_failed'],
    ['重开', 'reopened_items'],
  ];
  $('queue-tier-summary').innerHTML = S.queue.total
    ? tierStats.map(([label, key]) => `<div class="queue-tier-stat"><span>${label}</span><strong>${Number(queueSummary[key]||0)}</strong></div>`).join('')
    : '';
  renderQueueFilters();
  if(!S.cases.length){
    $('list-body').innerHTML = '<div class="banner warn">暂无匹配病例。可切换筛选条件，或先在患者端提交一份就诊资料。</div>';
    renderPager(); return;
  }
  const rows = S.cases.map(c=>{
    const risk=String(c.risk_level||'low'), riskLabel={high:'高风险',medium:'中风险',low:'低风险'}[risk]||risk;
    const pending=Number(c.pending_items||0), exempt=Number(c.exempt_items||0);
    const required=Number(c.required_items!=null?c.required_items:pending), sample=Number(c.sample_items||0), automatic=Number(c.automatic_items||0);
    const highRisk=Number(c.high_risk_items||0), conflicts=Number(c.conflict_items||0), analysisFailed=Number(c.analysis_failed_items||0);
    const reopened=Array.isArray(c.reopened_item_ids)?c.reopened_item_ids.length:0;
    const reopenedLabels=Array.isArray(c.reopened_item_labels)?c.reopened_item_labels:[];
    return `<div class="queue-entry"><div class="queue-row" tabindex="0" role="button" onclick="openCase('${esc(c.case_id)}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCase('${esc(c.case_id)}')}">
      <div class="q-id" data-label="病例">#${esc(c.case_id)}<div class="tiny">${esc(c.sex||'—')} · ${esc(c.age||'—')}</div></div>
      <div class="q-main" data-label="主诉 / 牵头科室"><strong>${esc(c.primary_department||'待分诊')}</strong><div class="muted" title="${esc(c.chief_complaint||'')}">${esc(c.chief_complaint||'（未提供主诉）')}</div></div>
      <div class="q-risk ${esc(risk)}" data-label="风险"><span class="pill ${risk==='high'?'danger':(risk==='medium'?'warn':'ok')}">${esc(riskLabel)}</span>${c.conflict_count?`<div class="tiny">分歧 ${esc(c.conflict_count)}</div>`:''}</div>
      <div data-label="处理状态">${pending?`<span class="pill danger"><span class="dot"></span>待处理 ${pending}</span>`:`<span class="pill ok">${esc(c.case_state_label||'已处理')}</span>`}</div>
      <div class="tiny" data-label="更新">${esc(c.updated_at||c.created_at||'—')}<div>${esc(c.case_state_label||c.case_state||'')}</div></div>
    </div><details class="queue-details" data-queue-details><summary>查看详情</summary><div class="queue-details-body">
      <span class="queue-detail">可靠性：<span class="pill ${c.reliability==='高'?'ok':(c.reliability==='中'?'warn':'danger')}">${esc(c.reliability||'—')}</span></span>
      <span class="queue-detail">分析：${analysisBadge(c)}</span>
      <span class="queue-detail">必审 ${required} · 抽查 ${sample} · 自动 ${automatic}</span>
      ${(highRisk||conflicts||analysisFailed)?`<span class="queue-detail">${highRisk?`高风险 ${highRisk}　`:''}${conflicts?`冲突 ${conflicts}　`:''}${analysisFailed?`分析失败 ${analysisFailed}`:''}</span>`:''}
      ${exempt?`<span class="queue-detail">免审 ${exempt}</span>`:''}
      ${reopened?`<span class="queue-detail" style="color:var(--warn);">资料更新重开 ${reopened} 项：${esc(reopenedLabels.join('、'))}</span>`:''}
    </div></details></div>`;
  }).join('');
  $('list-body').innerHTML = `<div class="queue-table"><div class="queue-head"><div>病例</div><div>主诉 / 牵头科室</div><div>风险</div><div>处理状态</div><div>更新</div></div>${rows}</div>`;
  renderPager();
}

/* 分析状态徽章：医生一眼看出这条病例的模型分析是否就绪（批处理依赖它） */
function analysisBadge(c){
  const state = c.analysis_state || 'none';
  const label = {running:'分析中', done:'分析就绪', partial_failed:'部分未完成',
                 failed:'分析失败', none:'未分析'}[state] || state;
  const cls = state==='done' ? 'ok' : (state==='running' ? 'warn' : (state==='none' ? 'gray' : 'danger'));
  return `<span class="pill ${cls}" role="status" aria-label="${esc(label)}">${esc(label)}</span>`;
}

/* 批量补齐分析：把"分析未完成"的病例排进后台任务（逐例可见进度，不阻塞当前操作） */
async function analyzePending(){
  const r = await api('/api/v2/cases/analyze', {method:'POST', body:JSON.stringify({limit:3})});
  const d = r.data||{};
  if(r.status!==200 || !d.ok){ alert(d.error||'启动失败'); return; }
  alert(d.started_count
      ? `已排入后台分析：${(d.started||[]).join('、')}\n可以继续操作，列表里的状态会自动变为"分析中 → 分析就绪"。`
      : '没有需要补齐分析的病例（都在分析中或已就绪）。');
  loadList();
  setTimeout(loadList, 4000);
  setTimeout(loadList, 10000);
}

/* ===================== 打开病例 ===================== */
async function openCase(caseId){
  const previousCaseId = S.caseId;
  S.caseId = caseId;
  if(previousCaseId !== caseId) S.reviewActiveItemIds = [];
  const [c, rev, aud] = await Promise.all([
    api('/api/v2/case/'+caseId), api('/api/v2/case/'+caseId+'/review'), api('/api/v2/case/'+caseId+'/audit')
  ]);
  if(c.status!==200 || rev.status!==200){ alert('加载失败：'+((c.data&&c.data.error)||(rev.data&&rev.data.error)||c.status)); return; }
  S.caseData = (c.data.case||{});
  S.caseRole = String(c.data.case_role||'');
  S.review = rev.data;
  S.audit = (aud.status===200? aud.data : null);
  $('doctor-shell').classList.add('has-case');
  document.body.classList.add('doctor-case-mode');
  const p = (S.caseData.payload||{}), t = p.triage||{};
  renderCaseContext(t);
  enableCaseNav(true);
  renderReview();          // 右轨审核面板随病例刷新（含进度条）
  go('overview');
}
function renderCaseContext(triage){
  const t = triage || {};
  $('case-context-id').textContent = S.caseId ? `病例 #${S.caseId}` : '未选择病例';
  $('case-context-type').textContent = t.behavior_type || '—';
  $('case-context-reliability').textContent = (t.reliability||{}).level || '—';
}

/* ===================== MDT 启动判断 ===================== */

      </div>

      ${screening.purpose?`<div class="field"><div class="muted" style="min-width:88px;">会诊目标</div><div style="flex:1;">${esc(screening.purpose)}</div></div>`:''}

    ${triageConfirmation.status==='confirmed'?`<div class="banner ok" id="mdt-screening-prereq">已完成分流确认，当前范围：${scopeText}</div>`:'<div class="banner warn" id="mdt-screening-prereq">请先在“分流确认”中确认主责和协同科室，再判断是否启动正式 MDT。</div>'}
    <div class="field"><label style="min-width:112px;">是否启动正式 MDT</label>
      <select id="mdt-screening-decision" onchange="toggleMdtScreeningFields()" style="flex:1;">
        <option value="single_specialty">单专科处理</option>
        <option value="recommend_mdt">启动正式 MDT</option>
        <option value="need_more_info">需要补充资料</option>

    </div>

function toggleMdtScreeningFields(){
  const select = $('mdt-screening-decision');
  const box = $('mdt-screening-multi-fields');
  if(select && box) box.classList.toggle('hide', select.value!=='recommend_mdt');
}
async function submitMdtScreening(){
  const decision = String(($('mdt-screening-decision')||{}).value||'');
  const reason = String(($('mdt-screening-reason')||{}).value||'').trim();
  const purpose = String(($('mdt-screening-purpose')||{}).value||'').trim();
  const r = await api('/api/v2/case/'+S.caseId+'/mdt-screening', {method:'POST', body:JSON.stringify({decision, reason, purpose})});
  if(r.status!==200 || !r.data.ok){
    const n=$('mdt-screening-msg'); if(n) n.textContent=r.data.error||'保存失败';

}

function renderMdtPreparationPacket(){
  const packet = (S.review&&S.review.mdt_preparation_packet)||{};
  const screening = packet.screening||{};
  const triage = packet.triage||{};
  const opinions = packet.specialty_opinions||[];
  const evidenceLinks = packet.evidence_links||[];
  const gaps = packet.information_gaps||[];
  const questions = packet.open_questions||[];
  const uniqueText = list => [...new Set((list||[]).map(x=>String(x||'').trim()).filter(Boolean))];
  const groupedList = (title, items, sectionClass, limit=3) => {
    const values = uniqueText(items);
    if(!values.length) return '';
    const visible = values.slice(0, limit);
    const renderItems = list => `<ul>${list.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
    const more = values.length>limit
      ? `<details class="mdt-specialty-more"><summary>查看全部 ${values.length} 条</summary>${renderItems(values.slice(limit))}</details>` : '';
    return `<section class="mdt-specialty-section ${sectionClass}"><div class="mdt-specialty-section-title">${title}<span class="count">${values.length} 条</span></div><div class="mdt-specialty-copy">${renderItems(visible)}${more}</div></section>`;
  };
  const inferenceSection = items => {
    const values = (items||[]).filter(x=>String(x&&x.text||'').trim());
    if(!values.length) return '';
    const renderItems = list => list.map(x=>`<div class="mdt-inference">${esc(x.text||'')} ${(x.evidence_refs||[]).map(ref=>`<span class="ref">${esc(ref)}</span>`).join(' ')}</div>`).join('');
    const visible = values.slice(0,3);
    const more = values.length>3 ? `<details class="mdt-specialty-more"><summary>查看全部 ${values.length} 条</summary>${renderItems(values.slice(3))}</details>` : '';
    return `<section class="mdt-specialty-section mdt-specialty-inferences"><div class="mdt-specialty-section-title">AI 参考判断<span class="count">${values.length} 条</span></div><div class="mdt-specialty-copy">${renderItems(visible)}${more}</div></section>`;
  };
  const specialtyHtml = opinions.length ? opinions.map(op=>{
    const unavailable = op.status !== 'available';
    return `<article class="mdt-specialty-card">
      <div class="mdt-specialty-heading">
        <strong>${esc(op.department||'未注明科室')}</strong>
        <span class="pill ${unavailable?'gray':'info'}">${esc(op.source_label||'专科 AI 参考意见')}</span>
      </div>
      ${unavailable ? `<div class="mdt-specialty-empty">${esc(op.notice||'本专科参考意见暂未生成')}</div>` : `
        <div class="mdt-specialty-focus"><strong>关注点：</strong>${esc(op.focus||'—')}</div>
        <div class="mdt-specialty-sections">
          ${groupedList('已掌握事实', op.facts, 'mdt-specialty-facts', 4)}
          ${inferenceSection(op.inferences)}
          ${groupedList('待医生判断', (op.checks||[]).map(x=>x.content||x), 'mdt-specialty-checks', 3)}
          ${groupedList('信息缺口', op.information_gaps, 'mdt-specialty-gaps', 3)}
        </div>
      `}
    </article>`;

  const refsHtml = evidenceLinks.length
    ? evidenceLinks.map(x=>`<span class="ref" title="结构化资料来源">${esc(x.ref||'')}</span>`).join(' ')
    : '<span class="tiny">暂无可显示的原文出处</span>';
  return `<div class="card doctor-card-info" id="mdt-preparation-packet">
    <div class="inline-between">
      <h3 style="margin:0;">MDT 会前资料包</h3><span class="pill info">只读资料汇总</span>
    </div>
    <p class="tiny" style="margin-top:8px;">会前资料包只汇总已脱敏的结构化资料，逐项标明来源类型，供医生快速核对后再执行审核操作。</p>
    <div class="mdt-packet-grid">
      <div class="opcard"><strong>启动判断与会诊目标</strong><div class="tiny">处理方向：${esc(screening.decision_label||'待医生判断')}</div><div class="tiny">判断依据：${esc(screening.reason||'—')}</div><div class="tiny">会诊目标：${esc(screening.purpose||'—')}</div><div class="tiny">分流确定范围：${esc((screening.departments||[]).join('、')||'—')}</div></div>
      <div class="opcard"><strong>分诊摘要</strong><div class="tiny">牵头方向：${esc(triage.primary_department||'—')}</div><div class="tiny">协同方向：${esc((triage.secondary_departments||[]).join('、')||'—')}</div><div class="tiny">可靠性：${esc(triage.reliability||'—')}</div></div>
      <div class="opcard"><strong>证据来源</strong><div class="tiny" style="margin:6px 0;">${refsHtml}</div><div class="tiny">来源类型：患者结构化资料 / 专科 AI 参考意见 / 医生审核内容</div></div>
    </div>
    <div class="banner info mdt-ai-boundary"><strong>仅供会前参考：</strong>以下专科内容由 AI 根据结构化病例资料生成，不代表真实医生意见或正式 MDT 结论。</div>
    <h4>信息缺口</h4>${gapHtml}
    <h4>建议讨论的问题</h4>${questionHtml}
    <h4>AI 多专科预分析</h4><div class="tiny" style="margin-bottom:6px;">来源类型：${esc((packet.source_legend||{}).ai_reference||'专科 AI 参考意见')}</div>${specialtyHtml}
  </div>`;
}

function renderMdtFormalRecord(){
  const screening = (S.review&&S.review.mdt_screening)||{};
  const record = (S.review&&S.review.mdt_formal_record)||{};
  if(screening.decision==='single_specialty') return `<section class="mdt-formal-route mdt-route-ok"><h3>正式 MDT 会诊记录</h3><strong>本例按单专科处理</strong><p>医生已判断当前问题可由单一专科继续处理，因此不启动正式 MDT。</p></section>`;
  if(screening.decision==='need_more_info') return `<section class="mdt-formal-route mdt-route-warn"><h3>正式 MDT 会诊记录</h3><strong>补充资料后再判断</strong><p>先完成资料补充，资料齐备后重新判断是否需要正式 MDT。</p></section>`;
  if(screening.decision==='urgent_care') return `<section class="mdt-formal-route mdt-route-danger"><h3>正式 MDT 会诊记录</h3><strong>已转急症处理</strong><p>当前病例不进入普通 MDT 流程，请按急诊安排处理。</p></section>`;
  if(screening.decision!=='recommend_mdt') return `<section class="mdt-formal-route"><h3>正式 MDT 会诊记录</h3><p class="mdt-specialty-empty">完成 MDT 启动判断后，这里会显示对应的后续记录。</p></section>`;
  const formal = record.status_label || '待记录';
  const participants = (record.participants||[]).join('、');
  if(S.caseRole==='collaborator') return `<section class="mdt-formal-route mdt-route-ok" id="mdt-formal-record">
    <h3>正式 MDT 会诊记录</h3><strong>${esc(formal)}</strong>
    <p>你是协同医生，正式会诊记录由主责医生或 MDT 协调人维护。你可以查看会诊目标和当前状态。</p>
    <div class="mdt-formal-context"><strong>会诊目的：</strong>${esc(screening.purpose||'—')}<br><strong>参与科室：</strong>${esc((screening.departments||[]).join('、')||'—')}<br><strong>参与医生：</strong>${esc(participants||'待记录')}</div>
  </section>`;
  const disagreements = ((S.review&&S.review.mdt_preparation_packet)||{}).handling?.disagreements||[];
  const disagreementHtml = disagreements.length ? disagreements.map(item=>{
    const id = item.disagreement_id || item['分歧编号'] || '';
    const topic = item.topic || item['分歧主题'] || '未命名分歧';
    const status = item.status || item['处理状态'] || '待医生裁决';
    const choice = item.choice || item['牵头医生决定'] || '';
    const reason = item.reason || item['处理理由'] || '';
    const next = item.next_step || item['下一步'] || '';
    const statusCode = status==='已解决' ? 'resolved' : (status==='需要补充资料' ? 'need_more_info' : 'unresolved_with_followup');
    const safeKey = String(id).replace(/[^A-Za-z0-9_-]/g,'');
    return `<div class="opcard mdt-formal-disagreement"><div class="inline-between-tight"><strong>${esc(topic)}</strong><span class="pill ${status==='已解决'?'ok':'warn'}">${esc(status)}</span></div>
      <div class="tiny" style="margin-top:5px;">${esc(id)}　下一步：${esc(next||'需补充证据后再判断')}</div>
      <div class="field" style="margin-top:8px;"><label style="min-width:72px;">处理状态</label><select id="dis-status-${safeKey}" style="flex:1;"><option value="resolved" ${statusCode==='resolved'?'selected':''}>已解决</option><option value="unresolved_with_followup" ${statusCode==='unresolved_with_followup'?'selected':''}>未解决，需后续跟进</option><option value="need_more_info" ${statusCode==='need_more_info'?'selected':''}>需要补充资料</option></select></div>
      <div class="field"><label style="min-width:72px;">决定/结果</label><input id="dis-choice-${safeKey}" value="${esc(choice==='（未记录）'?'':choice)}" placeholder="填写牵头医生决定或修改结果" style="flex:1;"></div>
      <div class="field"><label style="min-width:72px;">处理理由</label><textarea id="dis-reason-${safeKey}" placeholder="说明判断依据" style="flex:1;min-height:54px;">${esc(reason==='（未记录）'?'':reason)}</textarea></div>
      <div class="field"><label style="min-width:72px;">下一步</label><textarea id="dis-next-${safeKey}" placeholder="填写后续安排" style="flex:1;min-height:54px;">${esc(next)}</textarea></div>
      <div class="inline-end"><span id="dis-msg-${safeKey}" class="tiny"></span><button class="mini" onclick="submitDisagreement('${esc(id)}','${safeKey}')">保存分歧处理</button></div></div>`;
  }).join('') : '<div class="tiny">AI 预分析未识别方向性分歧。</div>';
  return `<section class="mdt-formal-record" id="mdt-formal-record">
    <div class="inline-between"><div><h3 style="margin:0;">正式 MDT 会诊记录</h3><p class="tiny" style="margin-top:5px;">仅记录医生实际启动和讨论后的结果；AI 预分析不会自动变成会诊结论。</p></div><span class="pill ${record.status==='completed'?'ok':(record.status==='in_progress'?'warn':'gray')}">${esc(formal)}</span></div>
    <div class="mdt-formal-context"><strong>会诊目的：</strong>${esc(screening.purpose||'—')}<br><strong>参与科室：</strong>${esc((screening.departments||[]).join('、')||'—')}</div>
    <div class="field"><label for="mdt-formal-status">会诊状态</label><select id="mdt-formal-status" style="flex:1;"><option value="planned" ${record.status==='planned'?'selected':''}>待开始</option><option value="in_progress" ${record.status==='in_progress'?'selected':''}>进行中</option><option value="completed" ${record.status==='completed'?'selected':''}>已完成</option></select></div>
    <div class="field"><label for="mdt-formal-participants">参与医生</label><input id="mdt-formal-participants" value="${esc(participants)}" placeholder="用顿号分隔，例如：内分泌科医生、眼科医生" style="flex:1;"></div>
    <div class="field"><label for="mdt-formal-conclusion">会诊结论</label><textarea id="mdt-formal-conclusion" placeholder="已完成时填写医生共同形成的结论" style="flex:1;min-height:82px;">${esc(record.conclusion||'')}</textarea></div>
    <div class="field"><label for="mdt-formal-unresolved">未解决事项</label><textarea id="mdt-formal-unresolved" placeholder="仍需补充的判断或证据，没有可留空" style="flex:1;min-height:64px;">${esc(record.unresolved||'')}</textarea></div>
    <div class="field"><label for="mdt-formal-next">后续安排</label><textarea id="mdt-formal-next" placeholder="填写责任科室、复查或随访安排" style="flex:1;min-height:64px;">${esc(record.next_step||'')}</textarea></div>
    <div class="inline-end"><span id="mdt-formal-msg" class="tiny"></span><button class="primary mini" onclick="submitMdtFormalRecord()">保存正式 MDT 记录</button></div>
    <div class="mdt-formal-disagreements"><h4>正式会诊中的分歧处理</h4><p class="tiny">以下分歧需要以医生实际讨论结果为准，AI 识别内容只作提示。</p>${disagreementHtml}</div>
  </section>`;
}
async function submitMdtFormalRecord(){
  const participants = String(($('mdt-formal-participants')||{}).value||'').split(/[、,，\n]/).map(x=>x.trim()).filter(Boolean);
  const body = {
    status: String(($('mdt-formal-status')||{}).value||''), participants,
    conclusion: String(($('mdt-formal-conclusion')||{}).value||'').trim(),
    unresolved: String(($('mdt-formal-unresolved')||{}).value||'').trim(),
    next_step: String(($('mdt-formal-next')||{}).value||'').trim(),
  };
  const r = await api('/api/v2/case/'+S.caseId+'/mdt-formal-record', {method:'POST', body:JSON.stringify(body)});
  const msgBox = $('mdt-formal-msg');
  if(r.status!==200 || !r.data.ok){ if(msgBox) msgBox.textContent=r.data.error||'保存失败'; return; }
  if(msgBox){ msgBox.textContent='已保存正式 MDT 记录'; msgBox.className='tiny ok'; }
  await openCase(S.caseId);
  go('mdt');
}

function renderOverview(){
  const c = S.caseData||{}, p = c.payload||{}, prof = p.profile||{}, t = p.triage||{};
  $('ov-title').textContent = `病例 #${c.case_id} 总览`;
  const rel = t.reliability||{};
  const factText = value => String(value||'').trim();
  const formatFactLabel = (name, value) => {
    const left = factText(name), right = factText(value);
    if(!right) return left || '未命名资料';
    if(!left) return right;
    if(right===left) return left;
    if(right.startsWith(left)) return `${left}：${right.slice(left.length).replace(/^\s*[:：]?\s*/, '')}`;
    return `${left}：${right}`;
  };
  const sourceHtml = refs => sourceRefHtml(refs||[]);
  const factGrid = (list, render, empty='（未提供）', wide=false) => {
    if(!list || !list.length) return `<div class="overview-fact-empty">${empty}</div>`;
    return `<div class="overview-fact-grid">${list.map(x=>`<div class="overview-fact ${wide?'overview-fact-wide':''}"><div class="overview-fact-content">${render(x)}</div><div class="overview-fact-source">${sourceHtml(x.source_refs)}</div></div>`).join('')}</div>`;
  };
  const section = (title, body) => `<section class="overview-fact-section"><h3>${title}</h3>${body}</section>`;
  const symptomDuration = value => {
    const text = factText(value);
    if(!text) return '';
    return /持续|约|余|天|周|月|年/.test(text) ? text : `持续约${text}`;
  };
  const symptomText = s => `${esc(formatFactLabel(s.symptom, symptomDuration(s.onset)))} ${s.confidence==='low'?'<span class="pill info">AI 推断</span>':''}`;
  const diseaseText = d => `${esc(formatFactLabel(d.name, d.duration))} ${d.confidence==='low'?'<span class="pill info">AI 推断</span>':''}`;
  const examText = e => `${esc(formatFactLabel(e.item, e.value))} ${e.abnormal?'<span class="pill warn">异常</span>':''}`;
  const pending = (S.review&&S.review.summary)||{};
  const screening = (S.review&&S.review.mdt_screening)||{};
  const confirmation = (S.review&&S.review.triage_doctor_confirmation)||p.triage_doctor_confirmation||{};
  const formalRecord = (S.review&&S.review.mdt_formal_record)||{};
  const formalComplete = formalRecord.status==='completed';
  let todo = [];
  const triage = p.triage||{};
  if(!triage.primary || !triage.primary.department){
    todo.push(`<div class="field"><div style="flex:1;">尚未完成分流确认</div>
      <button class="mini" onclick="go('triage')">去分流确认</button></div>`);
  }
  if(!screening.status || screening.status!=='decided'){
    todo.push(`<div class="field"><div style="flex:1;">尚未完成 MDT 初筛</div>
      <button class="mini" onclick="go('mdt')">去 MDT 协作</button></div>`);
  }
  const pendingDisagreements = (S.review&&S.review.pending_disagreements)||[];
  if(screening.decision==='recommend_mdt' && pendingDisagreements.length){
    todo.push(`<div class="field"><div style="flex:1;">${pendingDisagreements.length} 条分歧待处理</div>
      <button class="mini" onclick="go('mdt')">去 MDT 协作</button></div>`);
  }
  if(screening.decision==='recommend_mdt' && !formalComplete){
    todo.push(`<div class="field"><div style="flex:1;">正式 MDT 尚未记录</div>
      <button class="mini" onclick="go('mdt')">记录正式 MDT</button></div>`);
  }
  if(pending.pending || !S.review.published){
    todo.push(`<div class="field"><div style="flex:1;">${pending.pending?pending.pending+' 条决策条目待审核；':''}报告审核${S.review.published?'':'版尚未完成'}</div></div>`);
  }
  if((p.gaps||[]).length) todo.push(`<div class="field"><div style="flex:1;">仍有 ${p.gaps.length} 项信息缺口未补</div>
      <button class="mini" onclick="go('review')">去审核条目</button></div>`);
  if(!todo.length) todo.push('<div class="tiny">暂无待处理事项</div>');

  const nextText = !confirmation.status||confirmation.status!=='confirmed'
    ? '下一步：先完成分流确认，再查看 MDT 预分析。'
    : (screening.decision==='single_specialty' ? '下一步：按单专科处理后进入报告审核。'
      : (screening.decision==='need_more_info' ? '下一步：补充资料后重新判断。'
        : (screening.decision==='urgent_care' ? '下一步：按急症流程处理，不进入普通 MDT。'
          : (screening.decision==='recommend_mdt' ? '下一步：完成正式 MDT 会诊记录，再进入报告审核。'
            : '下一步：查看 MDT 预分析，再决定是否启动正式 MDT。'))));
  let nextActions = !confirmation.status||confirmation.status!=='confirmed'
    ? `<button class="primary mini" onclick="go('triage')">去分流确认</button><button class="mini" disabled title="完成分流确认后可查看">完成分流后查看 MDT 预分析</button>`
    : (screening.decision==='recommend_mdt'
      ? (formalComplete ? `<button class="primary mini" onclick="go('review')">去报告审核</button>`
        : `<button class="primary mini" onclick="go('mdt')">记录正式 MDT</button><button class="mini" disabled>完成 MDT 记录后可进入报告审核</button>`)
      : (screening.decision==='single_specialty' ? `<button class="primary mini" onclick="go('review')">去报告审核</button>`
        : `<button class="primary mini" onclick="go('mdt')">查看 MDT 预分析</button>`));
  if(confirmation.status==='confirmed'){
    nextActions += `<button class="ghost mini" onclick="go('triage')">查看分流确认</button>`;
  }

  const patientRecord = `<details class="doctor-disclosure overview-full-record overview-patient-record" open>
      <summary class="overview-full-record-action"><span>查看完整病历资料</span><span class="tiny">检查、用药与信息缺口</span></summary>
      <div class="doctor-disclosure-body">
        ${section('症状持续情况', factGrid(prof.symptoms_timeline, symptomText))}
        ${section('已知疾病', factGrid(prof.diseases, diseaseText))}
        ${section('检查异常', factGrid(prof.exams, examText))}
        ${section('当前用药', (prof.medications||[]).length?`<div class="overview-fact-grid">${prof.medications.map(m=>`<div class="overview-fact"><div>${esc(formatFactLabel(m.name, m.dose))}</div></div>`).join('')}</div>`:'<div class="overview-fact-empty">（未提供）</div>')}
        ${section('信息缺口', (p.gaps||[]).length?`<div class="overview-fact-grid">${p.gaps.map(g=>`<div class="overview-fact overview-gap-item"><div>${esc(String(g).replace(/\s*[:：]?\s*信息不足\s*$/,'').trim())}</div><span class="pill warn">待补充</span></div>`).join('')}</div>`:'<div class="overview-fact-empty">（无）</div>')}
      </div>
    </details>`;
  $('ov-body').innerHTML = `
    <div class="overview-status-summary">
      <div class="overview-status-card"><div class="status-label">病例状态</div><strong class="status-value">${esc(S.review.case_state_label||'待医生审核')}</strong></div>
      <div class="overview-status-card"><div class="status-label">可靠性等级</div><strong class="status-value"><span class="pill ${rel.level==='高'?'ok':(rel.level==='中'?'warn':'danger')}">${esc(rel.level||'—')}</span></strong></div>
    </div>
    ${patientRecord}
    <section class="overview-task-list">
      <div class="doctor-primary-task">
        <h3 class="overview-task-label">当前待办</h3>
        <div class="overview-task-primary">${todo.slice(0,1).join('')}</div>
        ${todo.length>1?`<details class="doctor-disclosure overview-task-secondary"><summary>其他待办（${todo.length-1}）</summary>${todo.slice(1).join('')}</details>`:''}
        <div class="tiny" style="margin-top:8px;">先确认患者资料，再处理当前任务；完整资料和证据可在上方展开。</div>
        <div class="overview-workflow-actions"><strong>${nextText}</strong><div class="inline-wrap">${nextActions}</div></div>
      </div>
    </section>`;
}
/* ===================== 屏 C：分诊依据 ===================== */
function renderTriage(){
  const p = S.caseData.payload||{}, t = p.triage||{};
  const confirmation = (S.review&&S.review.triage_doctor_confirmation)||p.triage_doctor_confirmation||{};
  const ruleHits = t.rule_hits||[];
  const primary = t.primary||{}, secondary = t.secondary||[];
  const deptMap = new Map();
  const addDept = (name, role, signals) => {
    if(!name) return;
    const row = deptMap.get(name) || {department:name, role:role||'协作', signals:[]};
    if(!deptMap.has(name)) row.role = role || row.role;
    (signals||[]).filter(Boolean).forEach(signal=>{ if(!row.signals.includes(signal)) row.signals.push(signal); });
    deptMap.set(name, row);
  };
  addDept(primary.department, '牵头', [...(primary.signals||[]), primary.reason]);
  secondary.forEach(d=>addDept(d.department, d.role||'协作', [...(d.signals||[]), d.reason]));
  ruleHits.forEach(h=>{const name=h.department||h.dept;if(deptMap.has(name)) addDept(name, null, h.signals);});
  (t.selected||[]).forEach(name=>addDept(typeof name === 'string' ? name : name.department, '协作', []));
  const departmentRows = Array.from(deptMap.values());
  const conflicts = t.conflicts||[];
  const deptOptions = departmentRows.map(d=>d.department).filter(Boolean);
  const confirmationHtml = confirmation.status==='confirmed'
    ? `<section class="triage-confirmation-card" id="triage-doctor-confirmation"><div class="inline-between"><h3 style="margin:0;">已确认分流方向</h3><span class="pill ok">医生已确认</span></div><div class="field"><div class="muted">主责科室</div><strong>${esc(confirmation.primary_department||'—')}</strong></div><div class="field"><div class="muted">协同科室</div><div>${esc((confirmation.secondary_departments||[]).join('、')||'无')}</div></div><div class="tiny">确认理由：${esc(confirmation.reason||'—')} · ${esc(confirmation.confirmed_at||'')}</div></section>`
    : (S.caseRole==='collaborator'
      ? `<section class="triage-confirmation-card" id="triage-doctor-confirmation"><h3 style="margin-top:0;">等待主责医生确认分流</h3><div class="banner info">你是本病例的协同医生，暂不能修改主责科室或协同方向。</div></section>`

    </div>${confirmationHtml}
    ${conflicts.length?`<div class="banner danger" style="margin-top:12px;">模型与规则存在分歧（${conflicts.length} 条）：分歧保留并进入报告分歧区，不由 AI 静默覆盖
      ${conflicts.map(c=>`<div class="tiny">· ${esc(c.department||'')}：${esc(c.reason||c.model_reason||'待医生核对')}</div>`).join('')}</div>`:'<div class="banner ok" style="margin-top:12px;">分诊结果未发现冲突</div>'}`;

async function submitTriageConfirmation(){
  const primaryDepartment = String(($('triage-primary-department')||{}).value||'').trim();
  const secondaryDepartments = Array.from(document.querySelectorAll('[data-triage-secondary]:checked')).map(x=>x.value);
  const reason = String(($('triage-confirmation-reason')||{}).value||'').trim();
  const r = await api('/api/v2/case/'+S.caseId+'/triage-confirmation', {method:'POST', body:JSON.stringify({primary_department:primaryDepartment, secondary_departments:secondaryDepartments, reason})});
  const box = $('triage-confirmation-msg');
  if(r.status!==200 || !r.data.ok){ if(box) box.textContent=r.data.error||'保存失败'; return; }

  go('triage');
}

/* ===================== 屏 D：证据板 ===================== */
function sourceSnippet(ref){
  const text = String((((S.caseData||{}).payload||{}).masked_history)||'');
  const match = String(ref||'').match(/^S-1:(\d+)$/);
  if(!text || !match) return '原文暂不可用，请查看完整病历资料中的对应内容。';
  const offset = Number(match[1]);
  if(!Number.isSafeInteger(offset) || offset>=Array.from(text).length) return '无法定位原文，请核对对应资料。';
  const characters = Array.from(text);
  const start = Math.max(0, offset-32), end = Math.min(characters.length, offset+72);
  return (start>0?'…':'') + characters.slice(start,end).join('') + (end<characters.length?'…':'');
}
function sourceRefHtml(refs){
  return (refs||[]).map(ref=>/^S-1:\d+$/.test(String(ref||''))
    ? `<details class="source-ref" data-source-ref="${esc(ref)}"><summary><span class="source-ref-open">查看原文依据</span><span class="source-ref-close">收起原文依据</span></summary><div class="source-ref-text"><div>来源：患者原始描述（脱敏文本）</div>${esc(sourceSnippet(ref))}</div></details>`
    : `<span class="ref" title="系统记录的依据">${esc(ref)}</span>`).join('');
}
function profileSourceRows(profile){
  const rows = [];
  const factLabel = (name, value) => {
    const left = String(name||'').trim(), right = String(value||'').trim();
    if(!right) return left || '未命名资料';
    return right.startsWith(left) ? right : `${left}：${right}`;
  };
  (profile.exams||[]).forEach(e=>rows.push({label:factLabel(e.item, e.value), refs:e.source_refs||[]}));
  (profile.diseases||[]).forEach(d=>rows.push({label:factLabel(d.name, d.duration), refs:d.source_refs||[]}));
  (profile.symptoms_timeline||[]).forEach(s=>rows.push({label:factLabel(s.symptom, s.onset), refs:s.source_refs||[]}));
  return rows;
}
function renderEvidence(){
  const r = S.review||{}, p = S.caseData.payload||{};
  const packet = r.mdt_preparation_packet || {};
  const packetCards = packet.evidence || [];
  const ev = p.evidence || {};
  const normalizeCard = card => ({
    judgement: card.judgement || card['判断'] || '',
    department: card.department || card['科室'] || '',
    evidence_state: card.evidence_state || card['证据状态'] || '',
    support: (card.support||card['支持证据']||[]).map(item=>typeof item==='string'?item:(item['证据']||item.text||'')),
    missing: (card.missing||card['反向 / 不足证据']||[]).map(item=>typeof item==='string'?item:(item['证据']||item.text||'')),
    against: (card.against||[]).map(item=>typeof item==='string'?item:(item['证据']||item.text||'')),
  });
  const timeline = ev.timeline || (packet.timeline||[]).map(item=>({
    time:item.time||item['时间']||'—', label:item.label||item.content||item['内容']||'',
    kind:item.kind||item['类型']||'', source_refs:item.source_refs||((item['原文出处']||'').match(/S-\d+:\d+/g)||[]),
  }));
  const links = (ev.judgements || ev.links || []).map(normalizeCard);
  if(!links.length && packetCards.length) links.push(...packetCards.map(normalizeCard));
  if(!timeline.length && !links.length){
    const sourceRows = profileSourceRows(p.profile||{});
    $('ev-body').innerHTML = `<div class="doctor-empty-state"><strong>当前暂无判断—证据关联</strong><span>已有 ${sourceRows.length} 条结构化资料。可展开查看资料来源，或前往总览核对病情。</span></div>
      <details class="doctor-disclosure"><summary>查看可引用资料</summary><div class="doctor-disclosure-body">${sourceRows.length?sourceRows.map(row=>`<div class="source-row"><span>${esc(row.label||'未命名资料')}</span>${sourceRefHtml(row.refs)}</div>`).join(''):'<div class="tiny">暂无可引用的结构化资料。</div>'}</div></details>`;
    return;
  }
  const linkHtml = links.map(j=>`<div class="opcard">
      <strong>${esc(j.judgement||j.text||'')}</strong> <span class="pill">${esc(j.department||'')}</span>
      <span class="pill ${j.evidence_state==='direct'?'ok':(j.evidence_state==='conflict'?'danger':(j.evidence_state==='missing'?'gray':'warn'))}">${esc(j.evidence_state||'')}</span>
      ${(j.support||[]).map(s=>`<div class="tiny">支持：${esc(s)}</div>`).join('')}
      ${(j.missing||[]).map(s=>`<div class="tiny">缺失：${esc(s)}</div>`).join('')}
      ${(j.against||[]).length?j.against.map(s=>`<div class="tiny">反向：${esc(s)}</div>`).join(''):'<div class="tiny">反向：无</div>'}
    </div>`).join('');
  const timelineHtml = timeline.map(e=>`<div class="ev"><strong>${esc(e.time||e.onset||'—')}</strong>　${esc(e.label||e.symptom||e.item||'')}
      <span class="pill gray">${esc(e.kind||'')}</span>
      ${sourceRefHtml(e.source_refs)}</div>`).join('');
  $('ev-body').innerHTML = `
    <div class="doctor-decision-summary">
      <div><div class="muted">判断 ↔ 证据</div><strong>${links.length} 条关联</strong></div>
      <div><div class="muted">直接支持</div><span class="pill ok">${links.filter(x=>x.evidence_state==='direct').length} 条</span></div>
      <div><div class="muted">信息缺口</div><span class="pill warn">${(p.gaps||[]).length} 项</span></div>
    </div>
    <h3>判断 ↔ 证据关联</h3>${linkHtml}
    <details class="doctor-disclosure">
      <summary>查看完整证据时间线</summary>
      <div class="doctor-disclosure-body"><div class="tl">${timelineHtml}</div></div>
    </details>`;
}

/* ===================== 屏 E：AI 预分析与正式 MDT 记录 ===================== */
function doctorQuestionText(value){
  return String(value||'').replace(/^\s*(?:建议\s*)?(?:向医生确认|请医生确认)\s*[:：]?\s*/,'').trim() || '请结合当前资料判断下一步';
}
function renderMdt(){
  const mdt = (S.caseData.payload||{}).mdt||{};
  const agg = mdt.aggregation||{};
  const challenge = mdt.challenge||{};
  const consensus = agg.consensus||[];
  const disagreements = agg.disagreements||[];
  const openQuestions = [...new Set((agg.open_questions||[]).map(q=>String(q||'').trim()).filter(Boolean))];
  const uncertainties = [...new Set((agg.uncertainties||[]).map(u=>String(u&&u.topic||u||'').trim()).filter(Boolean))];
  const questionItems = [...new Set([...openQuestions, ...uncertainties]
    .map(doctorQuestionText).filter(Boolean))];
  const challengeQuestions = challenge.questions||[];
  const consensusHtml = consensus.length ? consensus.map(c=>`<div class="mdt-result-item"><strong>${esc(c.topic||'')}</strong><p>${esc((c.supporters||[]).join('、')||'多专科观点接近')}</p></div>`).join('') : '<div class="mdt-result-empty">暂无 AI 归纳的共同关注点</div>';
  const disagreementHtml = disagreements.length ? disagreements.map(d=>`<div class="mdt-result-item question"><strong>${esc(d.topic||'未命名分歧')}</strong><p>${Object.entries(d.positions||{}).map(([k,v])=>esc(k)+'：'+esc(v)).join('；')||'各科意见待补充'}</p></div>`).join('') : '<div class="mdt-result-empty">暂无 AI 识别的方向性分歧</div>';
  const questionHtml = [...questionItems, ...challengeQuestions.map(q=>String(q.question||q||'').trim()).filter(Boolean)]
    .filter((q,i,all)=>all.indexOf(q)===i)
    .map((q,i)=>`<div class="mdt-result-item question"><strong>${i+1}. ${esc(doctorQuestionText(q))}</strong></div>`).join('') || '<div class="mdt-result-empty">暂无 AI 标记的讨论问题</div>';
  $('mdt-body').innerHTML = `
    ${renderMdtScreening()}
    ${renderMdtPreparationPacket()}
    <section class="mdt-results" aria-labelledby="mdt-preanalysis-title">
      <h3 id="mdt-preanalysis-title">AI 预分析提示</h3>
      <div class="banner gray">以下共识、分歧和问题是 AI 对病例资料的预分析，供医生决定是否启动正式 MDT，不代表真实会诊结论。</div>
      <div class="doctor-decision-summary">
        <div><div class="muted">共同关注点</div><strong>${consensus.length} 条</strong></div>
        <div><div class="muted">潜在分歧</div><span class="pill ${disagreements.length?'danger':'ok'}">${disagreements.length} 条</span></div>
        <div><div class="muted">建议讨论问题</div><span class="pill ${questionItems.length?'warn':'gray'}">${questionItems.length} 条</span></div>
      </div>
      <section class="mdt-result-section"><h4>AI 归纳的共同关注点</h4><div class="mdt-result-list">${consensusHtml}</div></section>
      <section class="mdt-result-section"><h4>AI 识别的潜在分歧</h4><div class="mdt-result-list">${disagreementHtml}</div></section>
      <section class="mdt-result-section"><h4>建议讨论问题</h4><div class="mdt-result-list">${questionHtml}</div></section>
    </section>
    ${renderMdtFormalRecord()}`;
}
